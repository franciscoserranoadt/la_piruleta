<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#c85a32">
  <title>TPV LA PIRULETA</title>

  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="manifest.json">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#c85a32',
              hover: '#b24c28',
              light: '#fdf3ed'
            }
          },
          fontFamily: {
            heading: ['Space Grotesk', 'sans-serif'],
            sans: ['Plus Jakarta Sans', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; user-select: none; }
    .font-heading { font-family: 'Space Grotesk', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>

  <!-- Registro del Service Worker para funcionamiento Offline y PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker registrado con éxito:', reg.scope))
          .catch(err => console.log('Fallo al registrar Service Worker:', err));
      });
    }
  </script>
</head>
<body class="bg-stone-100 text-stone-900 min-h-screen flex flex-col antialiased">

  <!-- CABECERA PRINCIPAL -->
  <header class="bg-stone-900 text-white px-4 py-3 sticky top-0 z-30 shadow-md">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-[#c85a32] to-[#e05638] flex items-center justify-center shadow-md">
          <span class="text-xl">🍭</span>
        </div>
        <div>
          <h1 class="text-base font-bold tracking-tight font-heading leading-tight">LA PIRULETA</h1>
          <div class="flex items-center gap-1.5 text-[11px] text-stone-400">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span>Online • Caja 1</span>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="location.reload()" class="w-8 h-8 rounded-lg bg-stone-800 text-stone-300 flex items-center justify-center active:scale-95 text-xs" title="Recargar">
          🔄
        </button>
        <span class="text-xs bg-stone-800 text-stone-300 px-2.5 py-1 rounded-full font-medium">LP</span>
      </div>
    </div>

    <!-- MODO DE SERVICIO -->
    <div class="grid grid-cols-3 gap-1.5 mt-3 bg-stone-800/80 p-1 rounded-xl text-xs font-semibold">
      <button onclick="setModo(this, 'Barra')" class="modo-btn py-1.5 rounded-lg bg-stone-100 text-stone-900 shadow-sm transition">☕ Barra</button>
      <button onclick="setModo(this, 'Llevar')" class="modo-btn py-1.5 rounded-lg text-stone-300 hover:text-white transition">🛍️ Llevar</button>
      <button onclick="setModo(this, 'Mesa')" class="modo-btn py-1.5 rounded-lg text-stone-300 hover:text-white transition">🪑 Mesa</button>
    </div>
  </header>

  <!-- BARRA DE CATEGORÍAS -->
  <nav class="bg-white border-b border-stone-200 px-3 py-2.5 sticky top-[97px] z-20 shadow-xs">
    <div id="categoriasList" class="flex gap-2 overflow-x-auto no-scrollbar py-0.5">
      <!-- Inyectado por JS -->
    </div>
  </nav>

  <!-- CATÁLOGO DE PRODUCTOS -->
  <main class="flex-1 p-3 pb-28 overflow-y-auto">
    <div id="productosGrid" class="grid grid-cols-2 gap-2.5">
      <!-- Inyectado por JS -->
    </div>
  </main>

  <!-- BARRA INFERIOR / RESUMEN TICKET -->
  <footer class="fixed bottom-0 inset-x-0 bg-white border-t border-stone-200 p-3 shadow-2xl z-30">
    <div class="flex items-center justify-between gap-3 max-w-lg mx-auto">
      <div class="cursor-pointer" onclick="abrirModalTicket()">
        <p class="text-[11px] text-stone-500 font-semibold tracking-wider uppercase">Ticket actual</p>
        <div class="flex items-baseline gap-1.5">
          <span id="totalBadge" class="text-xl font-bold font-heading text-stone-900">0.00 €</span>
          <span id="itemsBadge" class="text-xs text-stone-600 bg-stone-100 px-2 py-0.5 rounded-full font-semibold">0 uds</span>
        </div>
      </div>
      <button id="btnCobrar" onclick="abrirModalCobro()" disabled class="flex-1 max-w-[200px] bg-stone-300 text-stone-500 font-bold py-3.5 px-4 rounded-xl text-sm flex items-center justify-center gap-2 transition cursor-not-allowed">
        <span>Cobrar</span>
        <span class="text-xs">➔</span>
      </button>
    </div>
  </footer>

  <!-- MODAL DE COBRO Y DESGLOSE -->
  <div id="modalCobro" class="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl max-h-[90vh] flex flex-col animate-in slide-in-from-bottom duration-200">
      <div class="flex justify-between items-center pb-3 border-b border-stone-100">
        <h3 class="font-bold text-lg font-heading text-stone-900">Cobrar Ticket</h3>
        <button onclick="cerrarModalCobro()" class="w-8 h-8 rounded-full bg-stone-100 text-stone-500 flex items-center justify-center font-bold">✕</button>
      </div>

      <!-- Resumen de Importe -->
      <div class="py-4 text-center bg-stone-50 rounded-2xl my-3">
        <span class="text-xs text-stone-500 uppercase tracking-widest font-semibold">Total a Cobrar</span>
        <div id="modalTotalCobro" class="text-3xl font-extrabold text-stone-900 font-heading">0.00 €</div>
      </div>

      <!-- Métodos de pago -->
      <div class="space-y-2 mb-4">
        <p class="text-xs font-semibold text-stone-500 uppercase tracking-wider">Método de pago</p>
        <div class="grid grid-cols-3 gap-2">
          <button onclick="seleccionarMetodo(this, 'Tarjeta')" class="metodo-btn p-3 rounded-xl border-2 border-[#c85a32] bg-[#fdf3ed] text-[#c85a32] font-bold text-xs flex flex-col items-center gap-1">
            <span class="text-xl">💳</span>
            <span>Tarjeta</span>
          </button>
          <button onclick="seleccionarMetodo(this, 'Efectivo')" class="metodo-btn p-3 rounded-xl border border-stone-200 text-stone-700 font-bold text-xs flex flex-col items-center gap-1 hover:bg-stone-50">
            <span class="text-xl">💶</span>
            <span>Efectivo</span>
          </button>
          <button onclick="seleccionarMetodo(this, 'Bizum')" class="metodo-btn p-3 rounded-xl border border-stone-200 text-stone-700 font-bold text-xs flex flex-col items-center gap-1 hover:bg-stone-50">
            <span class="text-xl">📱</span>
            <span>Bizum</span>
          </button>
        </div>
      </div>

      <!-- Botón Finalizar Venta -->
      <button onclick="procesarVenta()" class="w-full bg-[#c85a32] hover:bg-[#b24c28] text-white font-bold py-3.5 rounded-xl text-base shadow-lg shadow-[#c85a32]/25 active:scale-98 transition flex items-center justify-center gap-2">
        <span>Completar Cobro</span>
        <span>✓</span>
      </button>
    </div>
  </div>

  <!-- MODAL TICKET DIGITAL FINALIZADO -->
  <div id="modalExito" class="fixed inset-0 bg-black/70 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-3xl p-6 text-center shadow-2xl">
      <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-3xl mx-auto mb-3">✓</div>
      <h3 class="text-xl font-bold font-heading text-stone-900">¡Cobro Completado!</h3>
      <p id="ticketInfoExito" class="text-sm text-stone-500 mt-1">Ticket #1042 • 0.00 €</p>

      <div class="my-5 p-3.5 bg-stone-50 border border-stone-200 rounded-2xl text-left text-xs space-y-1.5 text-stone-600">
        <div class="flex justify-between font-bold text-stone-800">
          <span>LA PIRULETA</span>
          <span>CAFETERÍA/PAN</span>
        </div>
        <div class="border-t border-stone-200 my-1"></div>
        <div id="ticketDesgloseExito" class="space-y-1"></div>
      </div>

      <div class="flex flex-col gap-2">
        <button onclick="enviarWhatsApp()" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl text-sm flex items-center justify-center gap-2 hover:bg-emerald-700">
          <span>📱 Enviar Ticket por WhatsApp</span>
        </button>
        <button onclick="nuevaVenta()" class="w-full bg-stone-100 text-stone-700 font-bold py-3 rounded-xl text-sm hover:bg-stone-200">
          Nueva Venta
        </button>
      </div>
    </div>
  </div>

  <script>
    // CATÁLOGO DE PRODUCTOS (Completamente editable)
    const CATALOGO = [
      { id: 1, nombre: 'Flat White Doble', precio: 2.80, cat: 'Café', icono: '☕' },
      { id: 2, nombre: 'Cappuccino Avena', precio: 2.90, cat: 'Café', icono: '🥛' },
      { id: 3, nombre: 'Cold Brew Nitro', precio: 3.40, cat: 'Café', icono: '🧊' },
      { id: 4, nombre: 'Hogaza Masa Madre 1kg', precio: 4.20, cat: 'Pan', icono: '🥖' },
      { id: 5, nombre: 'Baguette Rústica', precio: 1.60, cat: 'Pan', icono: '🥖' },
      { id: 6, nombre: 'Croissant Mantequilla', precio: 2.10, cat: 'Bollería', icono: '🥐' },
      { id: 7, nombre: 'Pain au Chocolat', precio: 2.40, cat: 'Bollería', icono: '🍫' },
      { id: 8, nombre: 'Tosta Aguacate & Tomate', precio: 5.50, cat: 'Tostadas', icono: '🥪' },
      { id: 9, nombre: 'Zumo Naranja Natural', precio: 2.70, cat: 'Bebidas', icono: '🍊' },
      { id: 10, nombre: 'Piruleta Dulce Especial', precio: 1.50, cat: 'Dulces', icono: '🍭' }
    ];

    const CATEGORIAS = ['Todos', 'Café', 'Pan', 'Bollería', 'Tostadas', 'Bebidas', 'Dulces'];
    let categoriaActual = 'Todos';
    let ticket = [];
    let metodoPagoActual = 'Tarjeta';
    let modoServicio = 'Barra';

    // RENDERIZAR CATEGORÍAS
    function renderCategorias() {
      const container = document.getElementById('categoriasList');
      container.innerHTML = CATEGORIAS.map(cat => {
        const active = cat === categoriaActual;
        return `
          <button onclick="filtrarCategoria('${cat}')" 
            class="px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all ${active ? 'bg-stone-900 text-white shadow-xs' : 'bg-stone-100 text-stone-600 hover:bg-stone-200'}">
            ${cat}
          </button>
        `;
      }).join('');
    }

    // RENDERIZAR PRODUCTOS
    function renderProductos() {
      const container = document.getElementById('productosGrid');
      const filtrados = categoriaActual === 'Todos' ? CATALOGO : CATALOGO.filter(p => p.cat === categoriaActual);

      container.innerHTML = filtrados.map(prod => `
        <div onclick="agregarAlTicket(${prod.id})" 
          class="bg-white p-3.5 rounded-2xl border border-stone-200/90 shadow-xs flex flex-col justify-between active:scale-97 transition cursor-pointer hover:border-[#c85a32]/50">
          <div class="flex items-start justify-between">
            <span class="text-2xl">${prod.icono}</span>
            <span class="text-[10px] font-semibold text-stone-400 bg-stone-50 px-2 py-0.5 rounded-md">${prod.cat}</span>
          </div>
          <div class="mt-2">
            <h4 class="font-bold text-sm text-stone-900 leading-tight">${prod.nombre}</h4>
            <div class="flex items-baseline justify-between mt-2">
              <span class="font-extrabold text-[#c85a32] text-sm">${prod.precio.toFixed(2)} €</span>
              <span class="w-6 h-6 rounded-full bg-[#fdf3ed] text-[#c85a32] flex items-center justify-center font-bold text-xs">+</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    // AGREGAR AL TICKET
    function agregarAlTicket(id) {
      const prod = CATALOGO.find(p => p.id === id);
      const itemExistente = ticket.find(i => i.id === id);
      if (itemExistente) {
        itemExistente.cantidad++;
      } else {
        ticket.push({ ...prod, cantidad: 1 });
      }
      actualizarResumenTicket();
    }

    // ACTUALIZAR BADGES Y BOTÓN COBRAR
    function actualizarResumenTicket() {
      const total = ticket.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);
      const totalUds = ticket.reduce((sum, item) => sum + item.cantidad, 0);

      document.getElementById('totalBadge').innerText = total.toFixed(2) + ' €';
      document.getElementById('itemsBadge').innerText = totalUds + (totalUds === 1 ? ' ud' : ' uds');

      const btnCobrar = document.getElementById('btnCobrar');
      if (totalUds > 0) {
        btnCobrar.disabled = false;
        btnCobrar.className = 'flex-1 max-w-[200px] bg-[#c85a32] hover:bg-[#b24c28] text-white font-bold py-3.5 px-4 rounded-xl text-sm flex items-center justify-center gap-2 shadow-lg shadow-[#c85a32]/25 active:scale-95 transition cursor-pointer';
      } else {
        btnCobrar.disabled = true;
        btnCobrar.className = 'flex-1 max-w-[200px] bg-stone-300 text-stone-500 font-bold py-3.5 px-4 rounded-xl text-sm flex items-center justify-center gap-2 transition cursor-not-allowed';
      }
    }

    function filtrarCategoria(cat) {
      categoriaActual = cat;
      renderCategorias();
      renderProductos();
    }

    function setModo(btn, modo) {
      modoServicio = modo;
      document.querySelectorAll('.modo-btn').forEach(b => {
        b.className = 'modo-btn py-1.5 rounded-lg text-stone-300 hover:text-white transition';
      });
      btn.className = 'modo-btn py-1.5 rounded-lg bg-stone-100 text-stone-900 shadow-sm transition';
    }

    function abrirModalCobro() {
      const total = ticket.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);
      document.getElementById('modalTotalCobro').innerText = total.toFixed(2) + ' €';
      document.getElementById('modalCobro').classList.remove('hidden');
    }

    function cerrarModalCobro() {
      document.getElementById('modalCobro').classList.add('hidden');
    }

    function seleccionarMetodo(btn, metodo) {
      metodoPagoActual = metodo;
      document.querySelectorAll('.metodo-btn').forEach(b => {
        b.className = 'metodo-btn p-3 rounded-xl border border-stone-200 text-stone-700 font-bold text-xs flex flex-col items-center gap-1 hover:bg-stone-50';
      });
      btn.className = 'metodo-btn p-3 rounded-xl border-2 border-[#c85a32] bg-[#fdf3ed] text-[#c85a32] font-bold text-xs flex flex-col items-center gap-1';
    }

    function procesarVenta() {
      const total = ticket.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);
      cerrarModalCobro();

      document.getElementById('ticketInfoExito').innerText = 'Ticket #' + Math.floor(1000 + Math.random() * 9000) + ' • ' + total.toFixed(2) + ' € (' + metodoPagoActual + ')';
      
      const desglose = document.getElementById('ticketDesgloseExito');
      desglose.innerHTML = ticket.map(i => `
        <div class="flex justify-between">
          <span>${i.cantidad}x ${i.nombre}</span>
          <span class="font-semibold">${(i.precio * i.cantidad).toFixed(2)} €</span>
        </div>
      `).join('');

      document.getElementById('modalExito').classList.remove('hidden');
    }

    function nuevaVenta() {
      ticket = [];
      actualizarResumenTicket();
      document.getElementById('modalExito').classList.add('hidden');
    }

    function enviarWhatsApp() {
      const total = ticket.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);
      let texto = '🧾 *Ticket LA PIRULETA*\n';
      texto += '---------------------\n';
      ticket.forEach(i => {
        texto += `${i.cantidad}x ${i.nombre} - ${(i.precio * i.cantidad).toFixed(2)}€\n`;
      });
      texto += '---------------------\n';
      texto += `*Total:* ${total.toFixed(2)}€ (${metodoPagoActual})\n`;
      texto += '¡Gracias por su visita a La Piruleta! 🍭';
      
      window.open('https://api.whatsapp.com/send?text=' + encodeURIComponent(texto), '_blank');
    }

    // INICIALIZAR
    renderCategorias();
    renderProductos();
  </script>
</body>
</html>
