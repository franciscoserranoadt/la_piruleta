<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#c85a32">
  <title>TPV LA PIRULETA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
    .font-brand { font-family: 'Space Grotesk', sans-serif; }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-[#f7f2ea] text-stone-900 min-h-screen flex flex-col justify-between pb-24 select-none">

  <header class="sticky top-0 z-30 bg-[#fdfbf7]/90 backdrop-blur-md border-b border-stone-200/80 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-2xl bg-[#c85a32] text-white flex items-center justify-center font-bold text-xl shadow-sm">
        🍭
      </div>
      <div>
        <h1 class="font-brand font-bold text-lg leading-tight tracking-tight text-stone-900">LA PIRULETA</h1>
        <div class="flex items-center gap-1.5 text-xs text-stone-500 font-medium">
          <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block animate-pulse"></span>
          <span>Online • Caja 1</span>
        </div>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="reiniciarTicket()" title="Vaciar pedido" class="w-9 h-9 rounded-full bg-stone-100 border border-stone-200 flex items-center justify-center text-stone-600 hover:bg-stone-200 active:scale-95 transition">
        <i class="fa-solid fa-rotate-right text-xs"></i>
      </button>
      <div class="w-9 h-9 rounded-full bg-stone-800 text-amber-100 font-bold text-xs flex items-center justify-center border border-stone-700">
        LP
      </div>
    </div>
  </header>

  <div class="px-4 pt-3 pb-1 space-y-2.5">
    <div class="grid grid-cols-3 gap-1.5 bg-stone-200/70 p-1 rounded-xl text-xs font-semibold text-stone-600">
      <button class="py-1.5 rounded-lg bg-white text-[#c85a32] shadow-sm flex items-center justify-center gap-1.5 font-bold">
        <i class="fa-solid fa-mug-saucer text-xs"></i> Barra
      </button>
      <button class="py-1.5 rounded-lg hover:bg-white/50 flex items-center justify-center gap-1.5 transition">
        <i class="fa-solid fa-bag-shopping text-xs"></i> Llevar
      </button>
      <button class="py-1.5 rounded-lg hover:bg-white/50 flex items-center justify-center gap-1.5 transition">
        <i class="fa-solid fa-chair text-xs"></i> Mesa
      </button>
    </div>

    <div class="flex items-center gap-2 overflow-x-auto pb-1 text-xs font-medium">
      <button onclick="filtrarCategoria('Todos')" id="cat-Todos" class="px-3.5 py-1.5 rounded-full bg-stone-900 text-white font-semibold whitespace-nowrap shadow-sm">Todos</button>
      <button onclick="filtrarCategoria('Café')" id="cat-Café" class="px-3.5 py-1.5 rounded-full bg-white text-stone-600 border border-stone-200 whitespace-nowrap shadow-sm">☕ Café</button>
      <button onclick="filtrarCategoria('Pan')" id="cat-Pan" class="px-3.5 py-1.5 rounded-full bg-white text-stone-600 border border-stone-200 whitespace-nowrap shadow-sm">🥖 Pan</button>
      <button onclick="filtrarCategoria('Bollería')" id="cat-Bollería" class="px-3.5 py-1.5 rounded-full bg-white text-stone-600 border border-stone-200 whitespace-nowrap shadow-sm">🥐 Bollería</button>
      <button onclick="filtrarCategoria('Tostadas')" id="cat-Tostadas" class="px-3.5 py-1.5 rounded-full bg-white text-stone-600 border border-stone-200 whitespace-nowrap shadow-sm">🥪 Tostadas</button>
    </div>
  </div>

  <main class="p-4 flex-1">
    <div class="grid grid-cols-2 gap-3" id="catalogo"></div>
  </main>

  <div class="fixed bottom-0 left-0 right-0 p-3 bg-[#fdfbf7]/95 backdrop-blur-md border-t border-stone-200 z-40 max-w-lg mx-auto">
    <button onclick="abrirCobro()" id="btnCobrar" disabled class="w-full bg-[#c85a32] hover:bg-[#b04a25] active:scale-[0.98] transition-all text-white font-brand font-bold py-3.5 px-5 rounded-2xl flex items-center justify-between shadow-lg shadow-[#c85a32]/25 disabled:opacity-50 disabled:pointer-events-none">
      <div class="flex items-center gap-2">
        <span class="w-6 h-6 rounded-lg bg-black/20 flex items-center justify-center text-xs font-mono" id="cantTotal">0</span>
        <span class="text-sm font-semibold">Cobrar Ticket</span>
      </div>
      <span class="text-lg tracking-tight font-extrabold" id="precioTotal">0,00 €</span>
    </button>
  </div>

  <div id="modalCobro" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-[#fffdfa] w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl space-y-4 max-h-[92vh] overflow-y-auto">
      <div class="flex items-center justify-between pb-2 border-b border-stone-200">
        <div>
          <h3 class="font-brand font-bold text-lg text-stone-900">Cobro • LA PIRULETA</h3>
          <p class="text-xs text-stone-500" id="resumenModal">Ticket #1042</p>
        </div>
        <button onclick="cerrarCobro()" class="w-8 h-8 rounded-full bg-stone-100 flex items-center justify-center text-stone-500 hover:bg-stone-200">✕</button>
      </div>

      <div class="bg-amber-50/70 rounded-2xl p-4 text-center border border-amber-200/60">
        <span class="text-xs font-semibold uppercase tracking-wider text-amber-800">Total a Pagar</span>
        <div class="text-3xl font-extrabold font-brand text-stone-900 mt-1" id="totalModal">0,00 €</div>
      </div>

      <div class="bg-white rounded-xl p-3 border border-stone-200/80 text-xs space-y-1.5" id="desgloseItems"></div>

      <div id="seccionMetodos" class="space-y-2">
        <label class="text-xs font-bold text-stone-500 uppercase tracking-wider">Selecciona método de cobro</label>
        <div class="grid grid-cols-3 gap-2">
          <button onclick="finalizarVenta('Tarjeta')" class="p-3 rounded-xl border-2 border-stone-800 bg-stone-900 text-white flex flex-col items-center gap-1 active:scale-95 transition">
            <i class="fa-solid fa-credit-card text-lg text-amber-300"></i>
            <span class="text-xs font-bold">Tarjeta</span>
          </button>
          <button onclick="finalizarVenta('Efectivo')" class="p-3 rounded-xl border border-stone-200 bg-white text-stone-800 flex flex-col items-center gap-1 active:scale-95 transition hover:bg-stone-50 shadow-sm">
            <i class="fa-solid fa-money-bill-wave text-lg text-emerald-600"></i>
            <span class="text-xs font-bold">Efectivo</span>
          </button>
          <button onclick="finalizarVenta('Bizum')" class="p-3 rounded-xl border border-stone-200 bg-white text-stone-800 flex flex-col items-center gap-1 active:scale-95 transition hover:bg-stone-50 shadow-sm">
            <i class="fa-solid fa-mobile-screen-button text-lg text-sky-600"></i>
            <span class="text-xs font-bold">Bizum</span>
          </button>
        </div>
      </div>

      <div id="pantallaExito" class="hidden text-center py-4 space-y-3 bg-emerald-50/80 rounded-2xl p-4 border border-emerald-200">
        <div class="w-12 h-12 bg-emerald-500 text-white rounded-full flex items-center justify-center mx-auto text-xl shadow-md">✓</div>
        <h4 class="font-bold text-stone-900 text-base" id="exitoTitulo">¡Cobro Registrado!</h4>
        <p class="text-xs text-stone-600">Ticket 100% digital sin papel ni impresora</p>

        <div class="my-2 p-3 bg-white rounded-xl inline-block border border-stone-200 shadow-inner">
          <i class="fa-solid fa-qrcode text-5xl text-stone-800"></i>
          <p class="text-[10px] text-stone-400 mt-1 font-mono">Escanear para e-Ticket</p>
        </div>
        
        <div class="flex flex-col gap-2 pt-2">
          <button onclick="compartirWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-2.5 px-3 rounded-xl flex items-center justify-center gap-2 shadow-sm active:scale-95 transition">
            <i class="fa-brands fa-whatsapp text-sm"></i> Enviar ticket por WhatsApp
          </button>
          <button onclick="reiniciarTodo()" class="w-full bg-[#c85a32] hover:bg-[#b04a25] text-white text-xs font-bold py-2.5 px-4 rounded-xl shadow-sm active:scale-95 transition">
            Nuevo Cobro / Siguiente Venta
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    var productos = [
      { id: 1, nombre: "Flat White Doble", precio: 2.80, cat: "Café", emoji: "☕" },
      { id: 2, nombre: "Cappuccino Avena", precio: 2.90, cat: "Café", emoji: "🥛" },
      { id: 3, nombre: "Cold Brew Nitro", precio: 3.40, cat: "Café", emoji: "🧊" },
      { id: 4, nombre: "Hogaza Masa Madre 1kg", precio: 4.20, cat: "Pan", emoji: "🥖" },
      { id: 5, nombre: "Pan Centeno 500g", precio: 3.10, cat: "Pan", emoji: "🍞" },
      { id: 6, nombre: "Croissant Mantequilla", precio: 1.95, cat: "Bollería", emoji: "🥐" },
      { id: 7, nombre: "Pain au Chocolat", precio: 2.30, cat: "Bollería", emoji: "🍫" },
      { id: 8, nombre: "Tostada Ibérica AOVE", precio: 4.50, cat: "Tostadas", emoji: "🥪" }
    ];

    var carrito = {};
    var categoriaActiva = "Todos";

    function filtrarCategoria(cat) {
      categoriaActiva = cat;
      var categorias = ["Todos", "Café", "Pan", "Bollería", "Tostadas"];
      for (var i = 0; i < categorias.length; i++) {
        var c = categorias[i];
        var btn = document.getElementById("cat-" + c);
        if (btn) {
          if (c === cat) {
            btn.className = "px-3.5 py-1.5 rounded-full bg-stone-900 text-white font-semibold whitespace-nowrap shadow-sm";
          } else {
            btn.className = "px-3.5 py-1.5 rounded-full bg-white text-stone-600 border border-stone-200 whitespace-nowrap shadow-sm";
          }
        }
      }
      renderCatalogo();
    }

    function renderCatalogo() {
      var contenedor = document.getElementById("catalogo");
      var prodsFiltrados = categoriaActiva === "Todos" 
        ? productos 
        : productos.filter(function(p) { return p.cat === categoriaActiva; });

      var html = "";
      for (var i = 0; i < prodsFiltrados.length; i++) {
        var p = prodsFiltrados[i];
        var cant = carrito[p.id] || 0;
        var borde = cant > 0 ? "border-[#c85a32]/60 ring-2 ring-[#c85a32]/20" : "border-stone-200/80";
        var badge = cant > 0 ? "<span class=\"bg-[#c85a32] text-white text-xs font-bold px-2 py-0.5 rounded-full font-mono\">" + cant + "</span>" : "";
        var btnMenos = cant > 0 ? "<button onclick=\"modificarCantidad(" + p.id + ", -1)\" class=\"w-7 h-7 rounded-lg bg-stone-100 border border-stone-200 text-stone-700 flex items-center justify-center font-bold text-sm active:bg-stone-200\">-</button>" : "";

        html += "<div class=\"bg-white p-3.5 rounded-2xl border " + borde + " shadow-sm flex flex-col justify-between transition active:scale-[0.99]\">" +
          "<div class=\"flex items-start justify-between\"><span class=\"text-2xl\">" + p.emoji + "</span>" + badge + "</div>" +
          "<div class=\"my-2\"><h3 class=\"font-bold text-stone-900 text-sm leading-snug\">" + p.nombre + "</h3><p class=\"text-xs text-stone-400 font-medium\">" + p.cat + "</p></div>" +
          "<div class=\"flex items-center justify-between pt-1\"><span class=\"font-brand font-bold text-stone-900 text-sm\">" + p.precio.toFixed(2) + " €</span>" +
          "<div class=\"flex items-center gap-1\">" + btnMenos + "<button onclick=\"modificarCantidad(" + p.id + ", 1)\" class=\"w-7 h-7 rounded-lg bg-[#c85a32] text-white flex items-center justify-center font-bold text-sm shadow-sm active:scale-90\">+</button></div></div></div>";
      }
      contenedor.innerHTML = html;
      actualizarTotales();
    }

    function modificarCantidad(id, delta) {
      carrito[id] = (carrito[id] || 0) + delta;
      if (carrito[id] <= 0) { delete carrito[id]; }
      renderCatalogo();
    }

    function calcularTotal() {
      var total = 0;
      var cantidad = 0;
      for (var id in carrito) {
        var prod = null;
        for (var i = 0; i < productos.length; i++) {
          if (productos[i].id == id) { prod = productos[i]; break; }
        }
        if (prod) {
          total += prod.precio * carrito[id];
          cantidad += carrito[id];
        }
      }
      return { total: total, cantidad: cantidad };
    }

    function actualizarTotales() {
      var res = calcularTotal();
      document.getElementById("cantTotal").innerText = res.cantidad;
      document.getElementById("precioTotal").innerText = res.total.toFixed(2).replace('.', ',') + " €";
      document.getElementById("btnCobrar").disabled = res.cantidad === 0;
    }

    function abrirCobro() {
      var res = calcularTotal();
      if (res.cantidad === 0) return;
      document.getElementById("totalModal").innerText = res.total.toFixed(2).replace('.', ',') + " €";
      document.getElementById("resumenModal").innerText = res.cantidad + " productos • Ticket #" + Math.floor(1000 + Math.random() * 9000);

      var desglose = document.getElementById("desgloseItems");
      var html = "";
      for (var id in carrito) {
        var p = null;
        for (var i = 0; i < productos.length; i++) {
          if (productos[i].id == id) { p = productos[i]; break; }
        }
        if (p) {
          var sub = p.precio * carrito[id];
          html += "<div class=\"flex justify-between text-stone-600\"><span>" + carrito[id] + "x " + p.nombre + "</span><span class=\"font-medium\">" + sub.toFixed(2) + " €</span></div>";
        }
      }
      desglose.innerHTML = html;
      document.getElementById("seccionMetodos").classList.remove("hidden");
      document.getElementById("pantallaExito").classList.add("hidden");
      document.getElementById("modalCobro").classList.remove("hidden");
    }

    function cerrarCobro() {
      document.getElementById("modalCobro").classList.add("hidden");
    }

    function finalizarVenta(metodo) {
      document.getElementById("seccionMetodos").classList.add("hidden");
      document.getElementById("exitoTitulo").innerText = "¡Cobro con " + metodo + " Registrado!";
      document.getElementById("pantallaExito").classList.remove("hidden");
    }

    function reiniciarTicket() {
      carrito = {};
      renderCatalogo();
    }

    function reiniciarTodo() {
      carrito = {};
      renderCatalogo();
      cerrarCobro();
    }

    function compartirWhatsApp() {
      var res = calcularTotal();
      var detalle = "";
      for (var id in carrito) {
        var p = null;
        for (var i = 0; i < productos.length; i++) {
          if (productos[i].id == id) { p = productos[i]; break; }
        }
        if (p) {
          detalle += "• " + carrito[id] + "x " + p.nombre + "%0A";
        }
      }
      var texto = "🍭 *LA PIRULETA - Ticket de Compra*%0A---------------------------%0A" + detalle + "---------------------------%0A*Total: " + res.total.toFixed(2) + " €*%0A¡Muchas gracias por tu visita! 😊";
      window.open("https://wa.me/?text=" + texto, '_blank');
    }

    renderCatalogo();
  </script>
</body>
</html>
