<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#c85a32">
  <title>TPV LA PIRULETA</title>
  <link rel="manifest" href="./manifest.json">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"><\/script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase App & Firestore SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"><\/script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"><\/script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            display: ['"Space Grotesk"', 'sans-serif']
          },
          colors: {
            brand: {
              DEFAULT: '#c85a32',
              dark: '#a84520',
              light: '#fff8f1'
            }
          }
        }
      }
    }
  <\/script>
  <style>
    * { -webkit-tap-highlight-color: transparent; user-select: none; }
    input, textarea, select { user-select: text; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fff8f1; color: #2c1a14; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen bg-[#fff8f1] flex flex-col text-slate-800 pb-20 select-none">

  <!-- CABECERA SUPERIOR FIJA -->
  <header class="bg-white/95 backdrop-blur border-b border-orange-100 px-4 py-3 sticky top-0 z-30 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-orange-100 flex items-center justify-center text-xl shadow-inner cursor-pointer" onclick="cambiarVista('terminal')">
        🍭
      </div>
      <div>
        <div class="flex items-center gap-2">
          <span class="font-extrabold text-base tracking-tight font-display text-slate-900" id="headerNombreComercial">LA PIRULETA</span>
          <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider bg-amber-100 text-amber-800">Terminal</span>
        </div>
        <div class="flex items-center gap-1.5 text-xs text-slate-500 font-medium">
          <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block animate-pulse"></span>
          <span id="txtEstadoCloud">Cloud Conectado</span>
          <span class="text-slate-300">•</span>
          <span id="headerCajaNum">Caja 1</span>
        </div>
      </div>
    </div>
    
    <!-- Acciones Cabecera: LUPA, EDITOR CARTA Y AJUSTES FISCALES -->
    <div class="flex items-center gap-2">
      <button id="btnLupa" onclick="toggleBuscador()" class="w-10 h-10 rounded-full bg-slate-100 hover:bg-slate-200 active:scale-95 flex items-center justify-center text-slate-600 transition-all cursor-pointer" title="Buscar productos">
        <i class="fa-solid fa-magnifying-glass text-sm"></i>
      </button>
      <button onclick="abrirModalEditorCarta()" class="w-10 h-10 rounded-full bg-orange-500 text-white hover:bg-orange-600 active:scale-95 flex items-center justify-center transition-all shadow-sm cursor-pointer" title="Editar carta y categorías en la nube">
        <i class="fa-solid fa-pen-to-square text-sm"></i>
      </button>
      <button id="btnAjustes" onclick="toggleAjustesModal()" class="w-10 h-10 rounded-full bg-amber-100/70 hover:bg-amber-100 active:scale-95 flex items-center justify-center text-amber-800 transition-all cursor-pointer" title="Datos fiscales y ajustes">
        <i class="fa-solid fa-sliders text-sm"></i>
      </button>
    </div>
  </header>

  <!-- BARRA DE BÚSQUEDA DESPLEGABLE -->
  <div id="barraBuscador" class="hidden bg-white border-b border-orange-100 px-4 py-2.5 transition-all">
    <div class="relative flex items-center">
      <i class="fa-solid fa-search absolute left-3.5 text-slate-400 text-xs"></i>
      <input type="text" id="inputBuscar" oninput="filtrarProductos()" placeholder="Buscar café, pan, bollería..." class="w-full pl-9 pr-8 py-2 rounded-xl bg-slate-100 border border-slate-200 text-sm focus:outline-none focus:border-orange-400">
      <button onclick="toggleBuscador()" class="absolute right-2.5 text-slate-400 hover:text-slate-600 p-1">
        <i class="fa-solid fa-xmark text-xs"></i>
      </button>
    </div>
  </div>

  <!-- TOAST DE NOTIFICACIÓN DE ARTÍCULO AÑADIDO -->
  <div id="toastArticuloAñadido" class="fixed top-16 left-1/2 -translate-x-1/2 bg-slate-900/90 backdrop-blur text-white px-4 py-2 rounded-full text-xs font-bold shadow-xl z-50 hidden flex items-center gap-2 border border-slate-700 transition-all">
    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
    <span id="toastArticuloTexto">Añadido al ticket</span>
  </div>

  <!-- BANNER INFORMATIVO CUANDO UNA MESA ESTÁ EN COMANDA ACTIVA -->
  <div id="bannerMesaActiva" class="hidden bg-gradient-to-r from-orange-600 to-amber-600 text-white px-4 py-2.5 flex items-center justify-between shadow-md sticky top-[61px] z-20">
    <div class="flex items-center gap-2">
      <span class="text-base">🪑</span>
      <div>
        <div class="flex items-center gap-1.5 leading-tight">
          <span class="font-extrabold text-xs" id="bannerMesaNombre">Mesa 1</span>
          <span class="text-[10px] bg-white/20 px-1.5 py-0.2 rounded-full font-bold" id="bannerMesaPax">2 pax</span>
        </div>
        <span class="text-[11px] text-orange-100 font-semibold" id="bannerMesaTotal">0.00 € (0 arts.)</span>
      </div>
    </div>
    <div class="flex items-center gap-1.5">
      <button onclick="cambiarVista('cobro')" class="px-2.5 py-1 rounded-lg bg-white text-orange-700 font-extrabold text-[11px] shadow-sm active:scale-95">
        Ver Ticket
      </button>
      <button onclick="terminarComandaMesa()" class="px-2 py-1 rounded-lg bg-black/20 text-white font-bold text-[11px] hover:bg-black/30 active:scale-95" title="Guardar comanda y volver a Barra">
        Salir
      </button>
    </div>
  </div>

  <!-- VISTA 1: TERMINAL (CATÁLOGO) -->
  <section id="vista-terminal" class="vista-seccion px-4 py-4 space-y-4">
    <!-- Selector de Servicio -->
    <div class="grid grid-cols-3 gap-2 bg-slate-200/60 p-1 rounded-xl text-xs font-bold text-center">
      <button onclick="seleccionarServicio('barra', this)" class="btn-servicio py-2 rounded-lg bg-white shadow-sm text-orange-600">☕ Barra</button>
      <button onclick="seleccionarServicio('llevar', this)" class="btn-servicio py-2 rounded-lg text-slate-600">🛍️ Llevar</button>
      <button onclick="cambiarVista('mesas')" class="btn-servicio py-2 rounded-lg text-slate-600">🪑 Mesas</button>
    </div>

    <!-- Pestañas de Categoría Dinámicas -->
    <div class="flex items-center gap-2 overflow-x-auto pb-1 no-scrollbar text-xs font-semibold" id="pestañasCategorias">
      <!-- Se generan dinámicamente -->
    </div>

    <!-- Rejilla de Productos -->
    <div id="gridProductos" class="grid grid-cols-2 gap-3 pb-6"></div>
  </section>

  <!-- VISTA 2: COBRO & TICKET -->
  <section id="vista-cobro" class="vista-seccion hidden px-4 py-4 space-y-4">
    <div class="bg-white rounded-2xl p-4 border border-orange-100 shadow-sm">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <div>
          <h2 class="font-bold text-base text-slate-900">Ticket en Curso</h2>
          <span id="ticketDestinoTexto" class="text-xs text-orange-600 font-semibold">Servicio: BARRA</span>
        </div>
        <button onclick="vaciarTicket()" class="text-xs font-medium text-rose-500 hover:text-rose-700 p-1 flex items-center gap-1">
          <i class="fa-solid fa-trash-can"></i> Vaciar
        </button>
      </div>

      <div id="ticketItems" class="divide-y divide-slate-100 py-2 min-h-[160px] max-h-[300px] overflow-y-auto">
        <p class="text-center text-xs text-slate-400 py-8">El ticket está vacío. Toca productos en el Terminal para añadir.</p>
      </div>

      <div class="pt-3 border-t border-slate-100 space-y-1.5 text-xs text-slate-600">
        <div class="flex justify-between">
          <span>Subtotal</span>
          <span id="txtSubtotal">0.00 €</span>
        </div>
        <div class="flex justify-between">
          <span>IVA (10%)</span>
          <span id="txtIVA">0.00 €</span>
        </div>
        <div class="flex justify-between text-base font-bold text-slate-900 pt-1 border-t border-dashed border-slate-200">
          <span>TOTAL A COBRAR</span>
          <span id="txtTotal" class="text-orange-600 text-lg">0.00 €</span>
        </div>
      </div>
    </div>

    <div class="space-y-2">
      <span class="text-xs font-bold text-slate-500 uppercase tracking-wider block">Forma de Pago</span>
      <div class="grid grid-cols-3 gap-2">
        <button onclick="seleccionarMetodo('efectivo', this)" class="btn-metodo py-3 px-2 rounded-xl border border-slate-200 bg-white font-semibold text-xs text-center shadow-sm flex flex-col items-center gap-1.5">
          <i class="fa-solid fa-money-bill-wave text-emerald-600 text-base"></i>
          <span>Efectivo</span>
        </button>
        <button onclick="seleccionarMetodo('tarjeta', this)" class="btn-metodo py-3 px-2 rounded-xl border-2 border-orange-500 bg-orange-50/50 font-bold text-xs text-center shadow-sm flex flex-col items-center gap-1.5 text-orange-600">
          <i class="fa-regular fa-credit-card text-orange-600 text-base"></i>
          <span>Datáfono</span>
        </button>
        <button onclick="seleccionarMetodo('bizum', this)" class="btn-metodo py-3 px-2 rounded-xl border border-slate-200 bg-white font-semibold text-xs text-center shadow-sm flex flex-col items-center gap-1.5">
          <i class="fa-solid fa-mobile-screen-button text-sky-600 text-base"></i>
          <span>Bizum</span>
        </button>
      </div>
    </div>

    <button onclick="ejecutarCobro()" class="w-full py-4 rounded-xl bg-[#c85a32] hover:bg-[#b04924] active:scale-98 text-white font-bold text-base shadow-lg shadow-orange-500/25 transition-all flex items-center justify-center gap-2">
      <i class="fa-solid fa-check text-lg"></i>
      <span>Completar Cobro</span>
    </button>
  </section>

  <!-- VISTA 3: MESAS (SALA & TERRAZA CON MENÚ DE OPCIONES) -->
  <section id="vista-mesas" class="vista-seccion hidden px-4 py-4 space-y-4">
    <div class="bg-white rounded-2xl p-4 border border-orange-100 shadow-sm flex items-center justify-between">
      <div>
        <h2 class="font-bold text-base text-slate-900">Estado de Sala & Mesas</h2>
        <p class="text-xs text-slate-500">Toca cualquier mesa para abrir su menú de gestión</p>
      </div>
      <button onclick="liberarTodasLasMesas()" class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-emerald-50 text-emerald-700 border border-emerald-200 hover:bg-emerald-100">
        Liberar Todas
      </button>
    </div>
    <div class="grid grid-cols-2 gap-3" id="gridMesas"></div>
  </section>

  <!-- VISTA 4: CAJA & ARQUEO (CIERRE Z) -->
  <section id="vista-caja" class="vista-seccion hidden px-4 py-4 space-y-4">
    <div class="bg-white rounded-2xl p-4 border border-orange-100 shadow-sm space-y-4">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <div>
          <h2 class="font-bold text-base text-slate-900">Arqueo de Turno</h2>
          <p class="text-xs text-slate-500" id="subtituloCajaTurno">Cierre Diario - Caja 1</p>
        </div>
        <span id="badgeEstadoCaja" class="px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-50 text-emerald-700 border border-emerald-200">
          Turno Abierto
        </span>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
          <span class="text-[11px] text-slate-500 font-medium block">Efectivo en Cajón</span>
          <span id="cajaEfectivo" class="text-lg font-extrabold text-emerald-600 block mt-1">0.00 €</span>
        </div>
        <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
          <span class="text-[11px] text-slate-500 font-medium block">Datafono / Tarjeta</span>
          <span id="cajaTarjeta" class="text-lg font-extrabold text-blue-600 block mt-1">0.00 €</span>
        </div>
        <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
          <span class="text-[11px] text-slate-500 font-medium block">Bizum Recibidos</span>
          <span id="cajaBizum" class="text-lg font-extrabold text-teal-600 block mt-1">0.00 €</span>
        </div>
        <div class="bg-amber-50/60 p-3 rounded-xl border border-amber-200/60">
          <span class="text-[11px] text-amber-800 font-medium block">Total Ventas</span>
          <span id="cajaTotal" class="text-lg font-extrabold text-amber-900 block mt-1">0.00 €</span>
        </div>
      </div>

      <button onclick="confirmarCierreZ()" class="w-full py-3.5 rounded-xl bg-[#c85a32] hover:bg-[#b04924] active:scale-98 text-white font-bold text-sm shadow-md transition-all flex items-center justify-center gap-2 cursor-pointer">
        <i class="fa-solid fa-lock text-sm"></i>
        <span>Cerrar Caja y Descargar Resumen Z</span>
      </button>
    </div>
  </section>

  <!-- MODAL DE MENÚ DE MESA (5 OPCIONES) -->
  <div id="modalMesaOpciones" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white rounded-t-3xl sm:rounded-2xl w-full max-w-sm p-5 space-y-4 shadow-2xl">
      <div class="flex items-center justify-between pb-2 border-b border-slate-100">
        <div>
          <h3 class="font-extrabold text-slate-900 text-base" id="modalMesaTitulo">Mesa 1</h3>
          <span class="text-xs text-orange-600 font-semibold" id="modalMesaSubtitulo">Estado actual: Libre</span>
        </div>
        <button onclick="cerrarModalMesa()" class="text-slate-400 hover:text-slate-600 p-1">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <!-- Selector Comensales -->
      <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-users text-orange-600 text-sm"></i>
          <span class="text-xs font-bold text-slate-700">Comensales:</span>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="cambiarComensalesMesa(-1)" class="w-7 h-7 rounded-lg bg-white border border-slate-200 font-bold text-slate-600 hover:bg-slate-100">-</button>
          <span id="txtComensalesModal" class="w-6 text-center font-extrabold text-sm text-slate-900">2</span>
          <button onclick="cambiarComensalesMesa(1)" class="w-7 h-7 rounded-lg bg-white border border-slate-200 font-bold text-slate-600 hover:bg-slate-100">+</button>
        </div>
      </div>

      <!-- 4 Botones de Acción de Mesa -->
      <div class="space-y-2 text-xs font-bold">
        <button onclick="mesaAccionAñadirProducto()" class="w-full py-3 px-4 rounded-xl bg-orange-600 text-white flex items-center justify-between active:scale-98 shadow-sm">
          <span>➕ Añadir Productos a Mesa</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
        <button onclick="mesaAccionVerTicket()" class="w-full py-3 px-4 rounded-xl bg-slate-100 text-slate-800 flex items-center justify-between active:scale-98">
          <span>🧾 Ver Ticket / Cuenta</span>
          <span id="txtTotalMesaModal" class="text-orange-600 font-black">0.00 €</span>
        </button>
        <button onclick="mesaAccionCobrar()" class="w-full py-3 px-4 rounded-xl bg-emerald-600 text-white flex items-center justify-between active:scale-98 shadow-sm">
          <span>💳 Cobrar Mesa</span>
          <i class="fa-solid fa-cash-register"></i>
        </button>
        <button onclick="mesaAccionAnular()" class="w-full py-2.5 px-4 rounded-xl bg-rose-50 text-rose-600 border border-rose-200 hover:bg-rose-100 flex items-center justify-center gap-1.5 active:scale-98">
          <i class="fa-solid fa-ban"></i>
          <span>Anular / Liberar Mesa</span>
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL DE AJUSTES & DATOS FISCALES -->
  <div id="modalAjustes" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-sm p-5 space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between pb-2 border-b border-slate-100">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-sliders text-orange-600"></i>
          <h3 class="font-bold text-slate-900 text-sm">Configuración y Datos Fiscales</h3>
        </div>
        <button onclick="toggleAjustesModal()" class="text-slate-400 hover:text-slate-600 p-1">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>

      <div class="space-y-2.5 text-xs">
        <div>
          <label class="font-semibold text-slate-700 block mb-1">Nombre Comercial</label>
          <input type="text" id="cfgNombre" value="LA PIRULETA" class="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-xs font-medium">
        </div>
        <div>
          <label class="font-semibold text-slate-700 block mb-1">CIF / NIF</label>
          <input type="text" id="cfgCIF" placeholder="B-12345678" class="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-xs font-medium">
        </div>
        <div>
          <label class="font-semibold text-slate-700 block mb-1">Nombre Fiscal / Razón Social</label>
          <input type="text" id="cfgRazonSocial" placeholder="Cafetería La Piruleta S.L." class="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-xs font-medium">
        </div>
        <div>
          <label class="font-semibold text-slate-700 block mb-1">Dirección y Código Postal</label>
          <input type="text" id="cfgDireccion" placeholder="Calle Mayor 12, 28001 Madrid" class="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-xs font-medium">
        </div>
        <div>
          <label class="font-semibold text-slate-700 block mb-1">Teléfono / WhatsApp</label>
          <input type="text" id="cfgTelefono" placeholder="600 000 000" class="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-xs font-medium">
        </div>
        <div>
          <label class="font-semibold text-slate-700 block mb-1">Pie del Ticket (Agradecimiento)</label>
          <textarea id="cfgPieTicket" rows="2" placeholder="¡Muchas gracias por su visita! Vuelva pronto" class="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-xs font-medium"></textarea>
        </div>
        <div>
          <label class="font-semibold text-slate-700 block mb-1">Punto de Venta / Caja</label>
          <input type="text" id="cfgCaja" value="Caja 1" class="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-xs font-medium">
        </div>
      </div>

      <div class="pt-2 flex gap-2">
        <button onclick="toggleAjustesModal()" class="flex-1 py-2.5 rounded-xl bg-slate-100 text-slate-700 font-semibold text-xs">Cerrar</button>
        <button onclick="guardarAjustes()" class="flex-1 py-2.5 rounded-xl bg-orange-600 text-white font-semibold text-xs">Guardar Ajustes</button>
      </div>
    </div>
  </div>

  <!-- MODAL DE EDICIÓN DE CARTA & CATEGORÍAS (SINCRONIZADO CON FIREBASE) -->
  <div id="modalEditorCarta" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-sm p-5 space-y-4 shadow-2xl max-h-[88vh] flex flex-col">
      <div class="flex items-center justify-between pb-2 border-b border-slate-100 shrink-0">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-pen-to-square text-orange-600"></i>
          <h3 class="font-bold text-slate-900 text-sm">Gestor de Carta y Categorías</h3>
        </div>
        <button onclick="cerrarModalEditorCarta()" class="text-slate-400 hover:text-slate-600 p-1">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>

      <!-- Selector de Subpestaña: Artículos vs Categorías -->
      <div class="grid grid-cols-2 gap-2 bg-slate-100 p-1 rounded-xl text-xs font-bold text-center shrink-0">
        <button onclick="cambiarTabEditor('articulos', this)" class="btn-tab-editor py-1.5 rounded-lg bg-white shadow-sm text-orange-600">📦 Artículos</button>
        <button onclick="cambiarTabEditor('categorias', this)" class="btn-tab-editor py-1.5 rounded-lg text-slate-600">🏷️ Categorías</button>
      </div>
      
      <!-- SUBPESTAÑA 1: GESTIÓN DE ARTÍCULOS -->
      <div id="editorTabArticulos" class="space-y-3 flex-1 flex flex-col overflow-hidden">
        <!-- Formulario Crear/Editar Artículo -->
        <div class="bg-orange-50/60 p-3 rounded-xl border border-orange-100 space-y-2 text-xs shrink-0">
          <div class="flex items-center justify-between">
            <span class="font-bold text-orange-950 block" id="tituloFormArticulo">Añadir Nuevo Producto</span>
            <button id="btnCancelarEdicionProd" onclick="cancelarEdicionProducto()" class="hidden text-[11px] text-rose-600 font-bold underline">Cancelar</button>
          </div>
          <input type="hidden" id="editandoProdId" value="">
          <div class="grid grid-cols-2 gap-2">

  <!-- JAVASCRIPT: LÓGICA COMPLETA DE TPV, MESAS VINCULADAS, FIREBASE Y DATOS FISCALES -->
  <script>
    // 1. CONFIGURACIÓN FIREBASE FIRESTORE
    const firebaseConfig = {
      apiKey: "AIzaSyDZ5xWCNJu2y6xg5x3QT03zlv58LWL96zQ",
      authDomain: "la-piruleta-tpv.firebaseapp.com",
      projectId: "la-piruleta-tpv",
      storageBucket: "la-piruleta-tpv.firebasestorage.app",
      messagingSenderId: "84528722277",
      appId: "1:84528722277:web:1dab40c7cf81fc92a0b18c"
    };

    let db = null;
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
      document.getElementById('txtEstadoCloud').innerText = "Cloud Conectado";
    } catch(err) {
      console.warn("Modo local activo:", err);
      document.getElementById('txtEstadoCloud').innerText = "Modo Local";
    }

    // Categorías base
    const categoriasBase = [
      { id: 'cafe', nombre: 'Café', icono: '☕' },
      { id: 'pan', nombre: 'Pan', icono: '🥖' },
      { id: 'bolleria', nombre: 'Bollería', icono: '🥐' },
      { id: 'tostadas', nombre: 'Tostadas', icono: '🥪' }
    ];

    // Catálogo base de seguridad
    const catalogoBase = [
      { id: 1, nombre: 'Flat White Doble', categoria: 'cafe', precio: 2.80, icono: '☕' },
      { id: 2, nombre: 'Cappuccino Avena', categoria: 'cafe', precio: 2.90, icono: '🥛' },
      { id: 3, nombre: 'Cold Brew Nitro', categoria: 'cafe', precio: 3.40, icono: '🧊' },
      { id: 4, nombre: 'Hogaza Masa Madre 1kg', categoria: 'pan', precio: 4.20, icono: '🥖' },
      { id: 5, nombre: 'Barra Rústica Tradicional', categoria: 'pan', precio: 1.30, icono: '🥖' },
      { id: 6, nombre: 'Croissant Mantequilla', categoria: 'bolleria', precio: 1.80, icono: '🥐' },
      { id: 7, nombre: 'Napolitana Chocolate', categoria: 'bolleria', precio: 2.10, icono: '🍫' },
      { id: 8, nombre: 'Tostada Tomate y Aceite', categoria: 'tostadas', precio: 2.50, icono: '🥪' }
    ];

    let categorias = JSON.parse(localStorage.getItem('piruleta_categorias')) || categoriasBase;
    let catalogo = JSON.parse(localStorage.getItem('piruleta_catalogo')) || catalogoBase;
    let ticketActual = [];
    let metodoPagoActivo = 'tarjeta';
    let servicioActivo = 'BARRA';
    let categoriaFiltroActiva = 'todos';
    let mesaActivaSeleccionada = null;

    // Mesas iniciales con comensales y comanda por mesa
    let mesas = JSON.parse(localStorage.getItem('piruleta_mesas')) || [
      { id: 1, nombre: 'Mesa 1', ocupada: false, pax: 2, ticket: [] },
      { id: 2, nombre: 'Mesa 2', ocupada: false, pax: 2, ticket: [] },
      { id: 3, nombre: 'Mesa 3', ocupada: false, pax: 4, ticket: [] },
      { id: 4, nombre: 'Mesa 4', ocupada: false, pax: 4, ticket: [] },
      { id: 5, nombre: 'Mesa 5', ocupada: false, pax: 2, ticket: [] },
      { id: 6, nombre: 'Mesa 6', ocupada: false, pax: 4, ticket: [] },
      { id: 7, nombre: 'Mesa 7', ocupada: false, pax: 6, ticket: [] },
      { id: 8, nombre: 'Mesa 8', ocupada: false, pax: 4, ticket: [] }
    ];

    // Caja diaria
    let caja = JSON.parse(localStorage.getItem('piruleta_caja')) || {
      efectivo: 0.00,
      tarjeta: 0.00,
      bizum: 0.00,
      total: 0.00
    };

    // Datos Fiscales editables
    let datosFiscales = JSON.parse(localStorage.getItem('piruleta_datos_fiscales')) || {
      nombre: "LA PIRULETA",
      cif: "",
      razonSocial: "",
      direccion: "",
      telefono: "",
      pieTicket: "¡Muchas gracias por su visita! Vuelva pronto",
      caja: "Caja 1"
    };

    function guardarDatosLocales() {
      localStorage.setItem('piruleta_mesas', JSON.stringify(mesas));
      localStorage.setItem('piruleta_caja', JSON.stringify(caja));
      localStorage.setItem('piruleta_catalogo', JSON.stringify(catalogo));
      localStorage.setItem('piruleta_categorias', JSON.stringify(categorias));
      localStorage.setItem('piruleta_datos_fiscales', JSON.stringify(datosFiscales));
    }

    // SINCRONIZACIÓN EN TIEMPO REAL CON FIRESTORE
    if (db) {
      // 1. Productos
      db.collection("productos").onSnapshot((snapshot) => {
        if (!snapshot.empty) {
          const list = [];
          snapshot.forEach(doc => {
            const data = doc.data();
            list.push({ 
              id: doc.id, 
              docId: doc.id, 
              nombre: data.nombre, 
              precio: Number(data.precio) || 0, 
              categoria: data.categoria || 'cafe', 
              icono: data.icono || '☕' 
            });
          });
          catalogo = list;
          guardarDatosLocales();
          renderCatalogo();
          renderListaEditor();
        } else {
          catalogoBase.forEach(item => {
            db.collection("productos").add(item);
          });
        }
      });

      // 2. Categorías
      db.collection("categorias").onSnapshot((snapshot) => {
        if (!snapshot.empty) {
          const catList = [];
          snapshot.forEach(doc => {
            const d = doc.data();
            catList.push({ id: doc.id, docId: doc.id, nombre: d.nombre, icono: d.icono || '🏷️' });
          });
          categorias = catList;
          guardarDatosLocales();
          renderPestañasCategorias();
          renderListaEditorCategorias();
          actualizarSelectorCategoriasProducto();
        }
      });
    }

    // NAVEGACIÓN ENTRE VISTAS
    function cambiarVista(vistaId) {
      document.querySelectorAll('.vista-seccion').forEach(sec => sec.classList.add('hidden'));
      const target = document.getElementById('vista-' + vistaId);
      if (target) target.classList.remove('hidden');

      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('text-orange-600');
        btn.classList.add('text-slate-400');
      });
      const activeBtn = document.getElementById('nav-' + vistaId);
      if (activeBtn) {
        activeBtn.classList.add('text-orange-600');
        activeBtn.classList.remove('text-slate-400');
      }

      if (vistaId === 'mesas') renderMesas();
      if (vistaId === 'caja') actualizarInterfazCaja();
      if (vistaId === 'cobro') actualizarTicketVisual();
    }

    // BUSCADOR CON LUPA
    function toggleBuscador() {
      const barra = document.getElementById('barraBuscador');
      const input = document.getElementById('inputBuscar');
      if (barra.classList.contains('hidden')) {
        barra.classList.remove('hidden');
        input.focus();
      } else {
        barra.classList.add('hidden');
        input.value = '';
        renderCatalogo(catalogo);
      }
    }

    function filtrarProductos() {
      const q = document.getElementById('inputBuscar').value.toLowerCase();
      const filtrados = catalogo.filter(p => p.nombre.toLowerCase().includes(q));
      renderCatalogo(filtrados);
    }

    // FEEDBACK VISUAL RÁPIDO
    function mostrarFeedbackAñadido(nombreProd) {
      const toast = document.getElementById('toastArticuloAñadido');
      const txt = document.getElementById('toastArticuloTexto');
      txt.innerText = `+1 ${nombreProd} al ticket`;
      toast.classList.remove('hidden');
      clearTimeout(window._toastTimeout);
      window._toastTimeout = setTimeout(() => {
        toast.classList.add('hidden');
      }, 1400);
    }

    // BANNER DE MESA ACTIVA
    function actualizarBannerMesaActiva() {
      const banner = document.getElementById('bannerMesaActiva');
      if (!banner) return;
      if (mesaActivaSeleccionada) {
        const total = ticketActual.reduce((acc, curr) => acc + (Number(curr.precio || 0) * (Number(curr.cantidad) || 1)), 0);
        const numItems = ticketActual.reduce((acc, curr) => acc + (Number(curr.cantidad) || 1), 0);
        banner.classList.remove('hidden');
        document.getElementById('bannerMesaNombre').innerText = mesaActivaSeleccionada.nombre;
        document.getElementById('bannerMesaPax').innerText = (mesaActivaSeleccionada.pax || 2) + ' pax';
        document.getElementById('bannerMesaTotal').innerText = total.toFixed(2) + ' € (' + numItems + ' arts.)';
      } else {
        banner.classList.add('hidden');
      }
    }

    function terminarComandaMesa() {
      if (mesaActivaSeleccionada) {
        mesaActivaSeleccionada.ticket = JSON.parse(JSON.stringify(ticketActual));
        const idx = mesas.findIndex(m => m.id === mesaActivaSeleccionada.id);
        if (idx !== -1) {
          mesas[idx].ticket = JSON.parse(JSON.stringify(ticketActual));
          if (ticketActual.length > 0) mesas[idx].ocupada = true;
        }
        guardarDatosLocales();
      }
      mesaActivaSeleccionada = null;
      ticketActual = [];
      servicioActivo = 'BARRA';
      document.getElementById('ticketDestinoTexto').innerText = 'Servicio: BARRA';
      actualizarTicketVisual();
      actualizarBannerMesaActiva();
      renderMesas();
    }

    // AJUSTES Y DATOS FISCALES
    function toggleAjustesModal() {
      const modal = document.getElementById('modalAjustes');
      modal.classList.toggle('hidden');
      if (!modal.classList.contains('hidden')) {
        document.getElementById('cfgNombre').value = datosFiscales.nombre || "LA PIRULETA";
        document.getElementById('cfgCIF').value = datosFiscales.cif || "";
        document.getElementById('cfgRazonSocial').value = datosFiscales.razonSocial || "";
        document.getElementById('cfgDireccion').value = datosFiscales.direccion || "";
        document.getElementById('cfgTelefono').value = datosFiscales.telefono || "";
        document.getElementById('cfgPieTicket').value = datosFiscales.pieTicket || "";
        document.getElementById('cfgCaja').value = datosFiscales.caja || "Caja 1";
      }
    }

    function guardarAjustes() {
      datosFiscales.nombre = document.getElementById('cfgNombre').value.trim() || "LA PIRULETA";
      datosFiscales.cif = document.getElementById('cfgCIF').value.trim();
      datosFiscales.razonSocial = document.getElementById('cfgRazonSocial').value.trim();
      datosFiscales.direccion = document.getElementById('cfgDireccion').value.trim();
      datosFiscales.telefono = document.getElementById('cfgTelefono').value.trim();
      datosFiscales.pieTicket = document.getElementById('cfgPieTicket').value.trim();
      datosFiscales.caja = document.getElementById('cfgCaja').value.trim() || "Caja 1";

      guardarDatosLocales();
      document.getElementById('headerNombreComercial').innerText = datosFiscales.nombre;
      document.getElementById('headerCajaNum').innerText = datosFiscales.caja;
      toggleAjustesModal();
      alert('¡Datos fiscales guardados con éxito!');
    }

    // PESTAÑAS DE CATEGORÍA
    function renderPestañasCategorias() {
      const container = document.getElementById('pestañasCategorias');
      if (!container) return;
      container.innerHTML = '';

      // Botón "Todos"
      const btnTodos = document.createElement('button');
      btnTodos.onclick = () => filtrarCategoria('todos', btnTodos);
      btnTodos.className = `btn-cat px-4 py-2 rounded-xl ${categoriaFiltroActiva === 'todos' ? 'bg-slate-800 text-white shadow-sm' : 'bg-white text-slate-700 border border-orange-100'} shrink-0`;
      btnTodos.innerText = 'Todos';
      container.appendChild(btnTodos);

      // Botones por categoría
      categorias.forEach(cat => {
        const btn = document.createElement('button');
        btn.onclick = () => filtrarCategoria(cat.id, btn);
        btn.className = `btn-cat px-4 py-2 rounded-xl ${categoriaFiltroActiva === cat.id ? 'bg-slate-800 text-white shadow-sm' : 'bg-white text-slate-700 border border-orange-100'} shrink-0`;
        btn.innerHTML = `${cat.icono || '🏷️'} ${cat.nombre}`;
        container.appendChild(btn);
      });

      // Botón añadir/gestionar carta
      const btnMas = document.createElement('button');
      btnMas.onclick = abrirModalEditorCarta;
      btnMas.className = 'px-3 py-2 rounded-xl bg-orange-100 text-orange-800 font-bold shrink-0 flex items-center gap-1 border border-orange-200';
      btnMas.innerHTML = '<i class="fa-solid fa-plus text-xs"></i> Carta';
      container.appendChild(btnMas);
    }

    function filtrarCategoria(catId, btn) {
      categoriaFiltroActiva = catId;
      document.querySelectorAll('.btn-cat').forEach(b => {
        b.className = 'btn-cat px-4 py-2 rounded-xl bg-white text-slate-700 border border-orange-100 shrink-0';
      });
      if (btn) btn.className = 'btn-cat px-4 py-2 rounded-xl bg-slate-800 text-white shadow-sm shrink-0';

      if (catId === 'todos') {
        renderCatalogo(catalogo);
      } else {
        const filtrados = catalogo.filter(p => p.categoria === catId);
        renderCatalogo(filtrados);
      }
    }

    function seleccionarServicio(tipo, btn) {
      document.querySelectorAll('.btn-servicio').forEach(b => {
        b.className = 'btn-servicio py-2 rounded-lg text-slate-600';
      });
      if (btn) btn.className = 'btn-servicio py-2 rounded-lg bg-white shadow-sm text-orange-600';
      servicioActivo = tipo.toUpperCase();
      document.getElementById('ticketDestinoTexto').innerText = 'Servicio: ' + servicioActivo;
    }

    // CATÁLOGO & PRODUCTOS
    function renderCatalogo(lista = catalogo) {
      const grid = document.getElementById('gridProductos');
      if (!grid) return;
      grid.innerHTML = '';
      lista.forEach(prod => {
        const prodId = prod.id || prod.docId;
        const card = document.createElement('div');
        card.className = 'bg-white rounded-2xl p-4 border border-orange-100/80 shadow-sm flex flex-col justify-between active:scale-95 transition-all cursor-pointer hover:border-orange-200';
        card.innerHTML = `
          <div class="flex items-start justify-between">
            <span class="text-2xl">${prod.icono || '☕'}</span>
            <span class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">${prod.categoria}</span>
          </div>
          <div class="mt-3">
            <h4 class="font-bold text-xs text-slate-800 leading-tight">${prod.nombre}</h4>
            <div class="flex items-center justify-between mt-2 pt-2 border-t border-slate-50">
              <span class="font-extrabold text-sm text-slate-900">${Number(prod.precio || 0).toFixed(2)} €</span>
              <button onclick="event.stopPropagation(); agregarAlTicket('${prodId}')" class="w-8 h-8 rounded-xl bg-orange-600 text-white flex items-center justify-center font-bold text-sm shadow-sm hover:bg-orange-500 active:scale-90 transition-all">
                +
              </button>
            </div>
          </div>
        `;
        card.onclick = () => agregarAlTicket(prodId);
        grid.appendChild(card);
      });
    }

    // ==========================================
    // TICKET & COBRO (TOTALMENTE VINCULADOS A MESAS)
    // ==========================================
    function agregarAlTicket(id) {
      const prod = catalogo.find(p => String(p.id) === String(id) || String(p.docId) === String(id));
      if (!prod) {
        console.warn("Producto no encontrado:", id);
        return;
      }

      const existe = ticketActual.find(i => String(i.id) === String(id) || String(i.docId) === String(id));
      if (existe) {
        existe.cantidad = (Number(existe.cantidad) || 0) + 1;
      } else {
        ticketActual.push({
          id: prod.id || prod.docId,
          docId: prod.docId || prod.id,
          nombre: prod.nombre,
          precio: Number(prod.precio) || 0,
          categoria: prod.categoria,
          icono: prod.icono || '☕',
          cantidad: 1
        });
      }

      // Si hay una mesa seleccionada en comanda activa, sincronizar inmediatamente
      if (mesaActivaSeleccionada) {
        mesaActivaSeleccionada.ocupada = true;
        mesaActivaSeleccionada.ticket = JSON.parse(JSON.stringify(ticketActual));
        const idx = mesas.findIndex(m => m.id === mesaActivaSeleccionada.id);
        if (idx !== -1) {
          mesas[idx].ocupada = true;
          mesas[idx].ticket = JSON.parse(JSON.stringify(ticketActual));
        }
      }

      guardarDatosLocales();
      actualizarTicketVisual();
      actualizarBannerMesaActiva();
      mostrarFeedbackAñadido(prod.nombre);
    }

    function cambiarCantidad(id, delta) {
      const item = ticketActual.find(i => String(i.id) === String(id) || String(i.docId) === String(id));
      if (!item) return;
      item.cantidad = (Number(item.cantidad) || 0) + delta;
      if (item.cantidad <= 0) {
        ticketActual = ticketActual.filter(i => String(i.id) !== String(id) && String(i.docId) !== String(id));
      }

      if (mesaActivaSeleccionada) {
        mesaActivaSeleccionada.ticket = JSON.parse(JSON.stringify(ticketActual));
        const idx = mesas.findIndex(m => m.id === mesaActivaSeleccionada.id);
        if (idx !== -1) {
          mesas[idx].ticket = JSON.parse(JSON.stringify(ticketActual));
        }
      }

      guardarDatosLocales();
      actualizarTicketVisual();
      actualizarBannerMesaActiva();
    }

    function vaciarTicket() {
      ticketActual = [];
      if (mesaActivaSeleccionada) {
        mesaActivaSeleccionada.ticket = [];
        const idx = mesas.findIndex(m => m.id === mesaActivaSeleccionada.id);
        if (idx !== -1) {
          mesas[idx].ticket = [];
        }
      }
      guardarDatosLocales();
      actualizarTicketVisual();
      actualizarBannerMesaActiva();
    }

    function actualizarTicketVisual() {
      const container = document.getElementById('ticketItems');
      const badge = document.getElementById('badgeTicketCount');
      const totalCount = ticketActual.reduce((acc, curr) => acc + (Number(curr.cantidad) || 0), 0);

      if (totalCount > 0) {
        badge.innerText = totalCount;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }

      if (ticketActual.length === 0) {
        container.innerHTML = '<p class="text-center text-xs text-slate-400 py-8">El ticket está vacío. Toca productos en el Terminal para añadir.</p>';
        document.getElementById('txtSubtotal').innerText = '0.00 €';
        document.getElementById('txtIVA').innerText = '0.00 €';
        document.getElementById('txtTotal').innerText = '0.00 €';
        return;
      }

      container.innerHTML = '';
      let subtotal = 0;
      ticketActual.forEach(item => {
        const itemTotal = Number(item.precio || 0) * (Number(item.cantidad) || 1);
        subtotal += itemTotal;
        const itemId = item.id || item.docId;
        const div = document.createElement('div');
        div.className = 'py-2 flex items-center justify-between text-xs';
        div.innerHTML = `
          <div class="flex-1">
            <span class="font-bold text-slate-800">${item.nombre}</span>
            <div class="text-[11px] text-slate-400">${Number(item.precio || 0).toFixed(2)} € x ${item.cantidad}</div>
          </div>
          <div class="flex items-center gap-2">
            <div class="flex items-center border border-slate-200 rounded-lg bg-slate-50">
              <button onclick="cambiarCantidad('${itemId}', -1)" class="w-6 h-6 flex items-center justify-center font-bold text-slate-500 hover:text-slate-800">-</button>
              <span class="w-6 text-center font-bold">${item.cantidad}</span>
              <button onclick="cambiarCantidad('${itemId}', 1)" class="w-6 h-6 flex items-center justify-center font-bold text-slate-500 hover:text-slate-800">+</button>
            </div>
            <span class="font-bold text-slate-900 w-14 text-right">${itemTotal.toFixed(2)} €</span>
          </div>
        `;
        container.appendChild(div);
      });

      const iva = subtotal * 0.10;
      document.getElementById('txtSubtotal').innerText = (subtotal - iva).toFixed(2) + ' €';
      document.getElementById('txtIVA').innerText = iva.toFixed(2) + ' €';
      document.getElementById('txtTotal').innerText = subtotal.toFixed(2) + ' €';
    }

    function seleccionarMetodo(metodo, btn) {
      metodoPagoActivo = metodo;
      document.querySelectorAll('.btn-metodo').forEach(b => {
        b.className = 'btn-metodo py-3 px-2 rounded-xl border border-slate-200 bg-white font-semibold text-xs text-center shadow-sm flex flex-col items-center gap-1.5';
      });
      btn.className = 'btn-metodo py-3 px-2 rounded-xl border-2 border-orange-500 bg-orange-50/50 font-bold text-xs text-center shadow-sm flex flex-col items-center gap-1.5 text-orange-600';
    }

    function ejecutarCobro() {
      if (ticketActual.length === 0) {
        alert('No hay productos en el ticket.');
        return;
      }
      const total = ticketActual.reduce((acc, curr) => acc + (Number(curr.precio || 0) * (Number(curr.cantidad) || 1)), 0);
      if (metodoPagoActivo === 'efectivo') caja.efectivo += total;
      else if (metodoPagoActivo === 'tarjeta') caja.tarjeta += total;
      else if (metodoPagoActivo === 'bizum') caja.bizum += total;
      caja.total += total;

      // Si se cobraba una mesa, liberarla automáticamente
      if (mesaActivaSeleccionada) {
        const idx = mesas.findIndex(m => m.id === mesaActivaSeleccionada.id);
        if (idx !== -1) {
          mesas[idx].ocupada = false;
          mesas[idx].ticket = [];
        }
        mesaActivaSeleccionada = null;
        servicioActivo = 'BARRA';
        document.getElementById('ticketDestinoTexto').innerText = 'Servicio: BARRA';
      }

      guardarDatosLocales();
      vaciarTicket();
      actualizarBannerMesaActiva();
      renderMesas();
      alert('¡Cobro de ' + total.toFixed(2) + ' € completado con éxito!');
      cambiarVista('terminal');
    }

    // ==========================================
    // GESTIÓN DE MESAS Y MENÚ DE OPCIONES
    // ==========================================
    function abrirModalMesa(id) {
      const mesa = mesas.find(m => m.id === id);
      if (!mesa) return;
      mesaActivaSeleccionada = mesa;
      document.getElementById('modalMesaTitulo').innerText = mesa.nombre;
      document.getElementById('modalMesaSubtitulo').innerText = mesa.ocupada 
        ? `OCUPADA (${mesa.pax || 2} Pax)` 
        : `LIBRE (${mesa.pax || 2} Pax)`;
      document.getElementById('txtComensalesModal').innerText = mesa.pax || 2;
      
      const totalMesa = (mesa.ticket || []).reduce((acc, curr) => acc + (Number(curr.precio || 0) * (Number(curr.cantidad) || 1)), 0);
      document.getElementById('txtTotalMesaModal').innerText = totalMesa.toFixed(2) + ' €';

      document.getElementById('modalMesaOpciones').classList.remove('hidden');
    }

    function cerrarModalMesa() {
      document.getElementById('modalMesaOpciones').classList.add('hidden');
    }

    function cambiarComensalesMesa(delta) {
      if (!mesaActivaSeleccionada) return;
      mesaActivaSeleccionada.pax = Math.max(1, (mesaActivaSeleccionada.pax || 2) + delta);
      document.getElementById('txtComensalesModal').innerText = mesaActivaSeleccionada.pax;
      guardarDatosLocales();
      renderMesas();
    }

    function mesaAccionAñadirProducto() {
      if (!mesaActivaSeleccionada) return;
      mesaActivaSeleccionada.ocupada = true;
      servicioActivo = mesaActivaSeleccionada.nombre.toUpperCase();
      document.getElementById('ticketDestinoTexto').innerText = 'Servicio: ' + servicioActivo;
      
      // Cargar la comanda existente de la mesa en el ticket de trabajo
      ticketActual = JSON.parse(JSON.stringify(mesaActivaSeleccionada.ticket || []));
      
      guardarDatosLocales();
      actualizarTicketVisual();
      actualizarBannerMesaActiva();
      cerrarModalMesa();
      cambiarVista('terminal');
    }

    function mesaAccionVerTicket() {
      if (!mesaActivaSeleccionada) return;
      ticketActual = JSON.parse(JSON.stringify(mesaActivaSeleccionada.ticket || []));
      servicioActivo = mesaActivaSeleccionada.nombre.toUpperCase();
      document.getElementById('ticketDestinoTexto').innerText = 'Servicio: ' + servicioActivo;
      actualizarTicketVisual();
      actualizarBannerMesaActiva();
      cerrarModalMesa();
      cambiarVista('cobro');
    }

    function mesaAccionCobrar() {
      if (!mesaActivaSeleccionada) return;
      ticketActual = JSON.parse(JSON.stringify(mesaActivaSeleccionada.ticket || []));
      servicioActivo = mesaActivaSeleccionada.nombre.toUpperCase();
      document.getElementById('ticketDestinoTexto').innerText = 'Servicio: ' + servicioActivo;
      if (ticketActual.length === 0) {
        alert('Esta mesa no tiene productos en el ticket.');
        return;
      }
      actualizarTicketVisual();
      actualizarBannerMesaActiva();
      cerrarModalMesa();
      cambiarVista('cobro');
    }

    function mesaAccionAnular() {
      if (!mesaActivaSeleccionada) return;
      if (confirm(`¿Anular y liberar ${mesaActivaSeleccionada.nombre}?`)) {
        mesaActivaSeleccionada.ocupada = false;
        mesaActivaSeleccionada.ticket = [];
        const idx = mesas.findIndex(m => m.id === mesaActivaSeleccionada.id);
        if (idx !== -1) {
          mesas[idx].ocupada = false;
          mesas[idx].ticket = [];
        }
        mesaActivaSeleccionada = null;
        ticketActual = [];
        servicioActivo = 'BARRA';
        document.getElementById('ticketDestinoTexto').innerText = 'Servicio: BARRA';
        guardarDatosLocales();
        actualizarTicketVisual();
        actualizarBannerMesaActiva();
        renderMesas();
        cerrarModalMesa();
      }
    }

    function liberarTodasLasMesas() {
      if (confirm('¿Liberar todas las mesas y vaciar sus cuentas?')) {
        mesas.forEach(m => { m.ocupada = false; m.ticket = []; });
        mesaActivaSeleccionada = null;
        ticketActual = [];
        guardarDatosLocales();
        actualizarTicketVisual();
        actualizarBannerMesaActiva();
        renderMesas();
      }
    }

    function renderMesas() {
      const grid = document.getElementById('gridMesas');
      if (!grid) return;
      grid.innerHTML = '';
      mesas.forEach(m => {
        const total = (m.ticket || []).reduce((acc, curr) => acc + (Number(curr.precio || 0) * (Number(curr.cantidad) || 1)), 0);
        const div = document.createElement('div');
        div.className = `p-4 rounded-2xl border transition-all active:scale-95 cursor-pointer ${
          m.ocupada ? 'bg-rose-50/80 border-rose-200 text-rose-950 shadow-sm' : 'bg-white border-orange-100 text-slate-800 shadow-sm'
        }`;
        div.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="text-xs font-semibold text-slate-500">${m.nombre}</span>
            <span class="w-2.5 h-2.5 rounded-full ${m.ocupada ? 'bg-rose-500 animate-pulse' : 'bg-emerald-500'}"></span>
          </div>
          <div class="mt-2 text-center">
            <span class="text-2xl font-black font-display">${m.id}</span>
            <span class="block text-[11px] font-bold mt-1 uppercase tracking-wider ${m.ocupada ? 'text-rose-600' : 'text-emerald-600'}">
              ${m.ocupada ? 'OCUPADA' : 'LIBRE'}
            </span>
            ${m.ocupada ? `<span class="text-xs font-bold text-slate-700 block mt-0.5">${total.toFixed(2)} €</span>` : ''}
          </div>
          <div class="mt-2 pt-2 border-t ${m.ocupada ? 'border-rose-100' : 'border-slate-50'} text-center text-[10px] text-slate-400">
            Toca para opciones
          </div>
        `;
        div.onclick = () => abrirModalMesa(m.id);
        grid.appendChild(div);
      });
    }

    // CAJA & CIERRE Z CON DATOS FISCALES
    function actualizarInterfazCaja() {
      document.getElementById('cajaEfectivo').innerText = caja.efectivo.toFixed(2) + ' €';
      document.getElementById('cajaTarjeta').innerText = caja.tarjeta.toFixed(2) + ' €';
      document.getElementById('cajaBizum').innerText = caja.bizum.toFixed(2) + ' €';
      document.getElementById('cajaTotal').innerText = caja.total.toFixed(2) + ' €';
    }

    function confirmarCierreZ() {
      if (!confirm('¿Deseas cerrar el turno y descargar el resumen Z?')) return;
      const fecha = new Date().toLocaleString('es-ES');
      const resumen = `================================================
CIERRE DE CAJA Z - ${datosFiscales.nombre || 'LA PIRULETA'}
${datosFiscales.razonSocial ? 'Razón Social: ' + datosFiscales.razonSocial + '\n' : ''}${datosFiscales.cif ? 'CIF/NIF: ' + datosFiscales.cif + '\n' : ''}${datosFiscales.direccion ? 'Dirección: ' + datosFiscales.direccion + '\n' : ''}${datosFiscales.telefono ? 'Teléfono: ' + datosFiscales.telefono + '\n' : ''}Fecha: ${fecha}
Caja: ${datosFiscales.caja || 'Caja 1'}
================================================
Efectivo en Cajón:  ${caja.efectivo.toFixed(2)} €
Datáfono / Tarjeta: ${caja.tarjeta.toFixed(2)} €
Bizum Recibidos:    ${caja.bizum.toFixed(2)} €
------------------------------------------------
TOTAL VENTAS:       ${caja.total.toFixed(2)} €
================================================
${datosFiscales.pieTicket || '¡Gracias por su visita!'}`;

      const blob = new Blob([resumen], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'Cierre_Z_' + new Date().toISOString().slice(0, 10) + '.txt';
      a.click();

      caja = { efectivo: 0.00, tarjeta: 0.00, bizum: 0.00, total: 0.00 };
      guardarDatosLocales();
      actualizarInterfazCaja();
      alert('Cierre Z completado y caja reiniciada a 0.00 €.');
    }

    // ==========================================
    // GESTOR DE CARTA Y CATEGORÍAS (FIREBASE)
    // ==========================================
    function abrirModalEditorCarta() {
      document.getElementById('modalEditorCarta').classList.remove('hidden');
      renderListaEditor();
      renderListaEditorCategorias();
      actualizarSelectorCategoriasProducto();
    }
    function cerrarModalEditorCarta() {
      document.getElementById('modalEditorCarta').classList.add('hidden');
      cancelarEdicionProducto();
      cancelarEdicionCategoria();
    }

    function cambiarTabEditor(tab, btn) {
      document.querySelectorAll('.btn-tab-editor').forEach(b => {
        b.className = 'btn-tab-editor py-1.5 rounded-lg text-slate-600';
      });
      btn.className = 'btn-tab-editor py-1.5 rounded-lg bg-white shadow-sm text-orange-600';
      if (tab === 'articulos') {
        document.getElementById('editorTabArticulos').classList.remove('hidden');
        document.getElementById('editorTabCategorias').classList.add('hidden');
      } else {
        document.getElementById('editorTabArticulos').classList.add('hidden');
        document.getElementById('editorTabCategorias').classList.remove('hidden');
      }
    }

    function actualizarSelectorCategoriasProducto() {
      const select = document.getElementById('nuevoProdCat');
      if (!select) return;
      const valorPrevio = select.value;
      select.innerHTML = '';
      categorias.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat.id;
        opt.innerText = `${cat.icono || '🏷️'} ${cat.nombre}`;
        select.appendChild(opt);
      });
      if (valorPrevio) select.value = valorPrevio;
    }

    // ARTÍCULOS: LISTAR, CREAR, EDITAR Y ELIMINAR
    function renderListaEditor() {
      const container = document.getElementById('listaEditorProductos');
      if (!container) return;
      container.innerHTML = '';
      catalogo.forEach(p => {
        const pId = p.id || p.docId;
        const row = document.createElement('div');
        row.className = 'py-2 flex items-center justify-between';
        row.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="text-lg">${p.icono || '☕'}</span>
            <div>
              <span class="font-bold text-slate-800">${p.nombre}</span>
              <span class="text-[10px] text-slate-400 block">${p.categoria}</span>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <span class="font-bold text-orange-600">${Number(p.precio || 0).toFixed(2)} €</span>
            <button onclick="cargarProductoParaEdicion('${pId}')" class="text-amber-600 hover:text-amber-800 p-1" title="Editar">
              <i class="fa-solid fa-pen text-xs"></i>
            </button>
            <button onclick="eliminarProductoCloud('${pId}')" class="text-rose-500 hover:text-rose-700 p-1" title="Eliminar">
              <i class="fa-solid fa-trash-can text-xs"></i>
            </button>
          </div>
        `;
        container.appendChild(row);
      });
    }

    function cargarProductoParaEdicion(id) {
      const prod = catalogo.find(p => String(p.id) === String(id) || String(p.docId) === String(id));
      if (!prod) return;
      document.getElementById('editandoProdId').value = id;
      document.getElementById('nuevoProdNombre').value = prod.nombre;
      document.getElementById('nuevoProdPrecio').value = prod.precio;
      document.getElementById('nuevoProdCat').value = prod.categoria;
      document.getElementById('nuevoProdIcono').value = prod.icono || '☕';
      document.getElementById('tituloFormArticulo').innerText = "Editar Producto: " + prod.nombre;
      document.getElementById('btnGuardarProd').innerText = "Guardar Cambios";
      document.getElementById('btnCancelarEdicionProd').classList.remove('hidden');
    }

    function cancelarEdicionProducto() {
      document.getElementById('editandoProdId').value = '';
      document.getElementById('nuevoProdNombre').value = '';
      document.getElementById('nuevoProdPrecio').value = '';
      document.getElementById('nuevoProdIcono').value = '';
      document.getElementById('tituloFormArticulo').innerText = "Añadir Nuevo Producto";
      document.getElementById('btnGuardarProd').innerText = "Guardar en la Nube";
      document.getElementById('btnCancelarEdicionProd').classList.add('hidden');
    }

    function guardarNuevoProducto() {
      const idEdicion = document.getElementById('editandoProdId').value;
      const nom = document.getElementById('nuevoProdNombre').value.trim();
      const pre = parseFloat(document.getElementById('nuevoProdPrecio').value);
      const cat = document.getElementById('nuevoProdCat').value;
      const ico = document.getElementById('nuevoProdIcono').value.trim() || '☕';

      if (!nom || isNaN(pre)) {
        alert('Por favor, indica un nombre y un precio válido.');
        return;
      }

      const item = { nombre: nom, precio: pre, categoria: cat, icono: ico };

      if (idEdicion) {
        // EDICIÓN
        if (db && typeof idEdicion === 'string' && idEdicion.length > 10) {
          db.collection("productos").doc(idEdicion).update(item).then(() => {
            cancelarEdicionProducto();
            alert('¡Producto actualizado en la nube!');
          });
        } else {
          const idx = catalogo.findIndex(p => String(p.id) === String(idEdicion) || String(p.docId) === String(idEdicion));
          if (idx !== -1) catalogo[idx] = { ...catalogo[idx], ...item };
          guardarDatosLocales();
          renderCatalogo();
          renderListaEditor();
          cancelarEdicionProducto();
          alert('¡Producto actualizado!');
        }
      } else {
        // CREACIÓN
        if (db) {
          db.collection("productos").add(item).then(() => {
            cancelarEdicionProducto();
            alert('¡Producto guardado en la nube!');
          });
        } else {
          item.id = Date.now();
          item.docId = String(item.id);
          catalogo.push(item);
          guardarDatosLocales();
          renderCatalogo();
          renderListaEditor();
          cancelarEdicionProducto();
          alert('Guardado localmente.');
        }
      }
    }

    function eliminarProductoCloud(id) {
      if (!confirm('¿Eliminar este producto de la carta?')) return;
      if (db && typeof id === 'string' && id.length > 10) {
        db.collection("productos").doc(id).delete();
      } else {
        catalogo = catalogo.filter(p => String(p.id) !== String(id) && String(p.docId) !== String(id));
        guardarDatosLocales();
        renderCatalogo();
        renderListaEditor();
      }
    }

    // CATEGORÍAS: LISTAR, CREAR, EDITAR Y ELIMINAR
    function renderListaEditorCategorias() {
      const container = document.getElementById('listaEditorCategorias');
      if (!container) return;
      container.innerHTML = '';
      categorias.forEach(c => {
        const row = document.createElement('div');
        row.className = 'py-2 flex items-center justify-between';
        row.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="text-base">${c.icono || '🏷️'}</span>
            <span class="font-bold text-slate-800">${c.nombre}</span>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="cargarCategoriaParaEdicion('${c.id}')" class="text-amber-600 hover:text-amber-800 p-1" title="Editar">
              <i class="fa-solid fa-pen text-xs"></i>
            </button>
            <button onclick="eliminarCategoria('${c.id}')" class="text-rose-500 hover:text-rose-700 p-1" title="Eliminar">
              <i class="fa-solid fa-trash-can text-xs"></i>
            </button>
          </div>
        `;
        container.appendChild(row);
      });
    }

    function cargarCategoriaParaEdicion(id) {
      const cat = categorias.find(c => c.id === id);
      if (!cat) return;
      document.getElementById('editandoCatId').value = id;
      document.getElementById('nuevaCatNombre').value = cat.nombre;
      document.getElementById('nuevaCatIcono').value = cat.icono || '🏷️';
      document.getElementById('tituloFormCategoria').innerText = "Editar Categoría: " + cat.nombre;
      document.getElementById('btnGuardarCat').innerText = "Guardar Cambios";
      document.getElementById('btnCancelarEdicionCat').classList.remove('hidden');
    }

    function cancelarEdicionCategoria() {
      document.getElementById('editandoCatId').value = '';
      document.getElementById('nuevaCatNombre').value = '';
      document.getElementById('nuevaCatIcono').value = '';
      document.getElementById('tituloFormCategoria').innerText = "Nueva Categoría";
      document.getElementById('btnGuardarCat').innerText = "Guardar Categoría";
      document.getElementById('btnCancelarEdicionCat').classList.add('hidden');
    }

    function guardarCategoria() {
      const idEdicion = document.getElementById('editandoCatId').value;
      const nom = document.getElementById('nuevaCatNombre').value.trim();
      const ico = document.getElementById('nuevaCatIcono').value.trim() || '🏷️';

      if (!nom) {
        alert('Por favor, indica un nombre para la categoría.');
        return;
      }

      if (idEdicion) {
        // EDICIÓN
        const idx = categorias.findIndex(c => c.id === idEdicion);
        if (idx !== -1) {
          categorias[idx].nombre = nom;
          categorias[idx].icono = ico;
        }
        if (db && typeof idEdicion === 'string' && idEdicion.length > 10) {
          db.collection("categorias").doc(idEdicion).update({ nombre: nom, icono: ico });
        }
      } else {
        // CREACIÓN
        const catId = nom.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '_');
        const nuevaCat = { id: catId, nombre: nom, icono: ico };
        categorias.push(nuevaCat);
        if (db) {
          db.collection("categorias").add(nuevaCat);
        }
      }

      guardarDatosLocales();
      renderPestañasCategorias();
      renderListaEditorCategorias();
      actualizarSelectorCategoriasProducto();
      cancelarEdicionCategoria();
      alert('¡Categoría guardada con éxito!');
    }

    function eliminarCategoria(id) {
      if (!confirm('¿Eliminar esta categoría?')) return;
      categorias = categorias.filter(c => c.id !== id);
      if (db && typeof id === 'string' && id.length > 10) {
        db.collection("categorias").doc(id).delete();
      }
      guardarDatosLocales();
      renderPestañasCategorias();
      renderListaEditorCategorias();
      actualizarSelectorCategoriasProducto();
    }

    // INICIALIZACIÓN DE LA APLICACIÓN
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('headerNombreComercial').innerText = datosFiscales.nombre || "LA PIRULETA";
      document.getElementById('headerCajaNum').innerText = datosFiscales.caja || "Caja 1";
      renderPestañasCategorias();
      renderCatalogo();
      renderMesas();
      actualizarInterfazCaja();
      actualizarBannerMesaActiva();
    });
  <\/script>
</body>
</html>
