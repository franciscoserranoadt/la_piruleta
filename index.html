<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#c85a32">
  <title>TPV LA PIRULETA</title>
  <link rel="manifest" href="./manifest.json">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"><\/script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Firebase App & Firestore SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"><\/script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"><\/script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            display: ['"Space Grotesk"', 'sans-serif']
          },
          colors: {
            brand: { DEFAULT: '#c85a32', dark: '#a84520', light: '#fff8f1' }
          }
        }
      }
    }
  <\/script>

  <style>
    * { -webkit-tap-highlight-color: transparent; user-select: none; }
    input, textarea, select { user-select: text; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fff8f1; color: #2c1a14; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Estilos de Impresión Térmica de Ticket */
    @media print {
      body * { visibility: hidden; }
      #ticketImprimible, #ticketImprimible * { visibility: visible; }
      #ticketImprimible {
        position: absolute;
        left: 0;
        top: 0;
        width: 80mm;
        margin: 0;
        padding: 4mm;
        font-size: 11px;
        color: #000;
        background: #fff;
      }
    }
  </style>
</head>
<body class="min-h-screen bg-[#fff8f1] flex flex-col text-slate-800 select-none overflow-x-hidden">

  <!-- CABECERA SUPERIOR FIJA -->
  <header class="bg-white/95 backdrop-blur border-b border-orange-100 px-4 py-2.5 sticky top-0 z-30 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-orange-100 flex items-center justify-center text-xl shadow-inner cursor-pointer" onclick="volverAlMostrador()">
        🍭
      </div>
      <div>
        <div class="flex items-center gap-2">
          <span class="font-extrabold text-base tracking-tight font-display text-slate-900" id="headerNombreComercial">LA PIRULETA</span>
          <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider bg-orange-100 text-orange-800">Terminal Táctil</span>
          <span class="text-xs text-slate-500 font-medium hidden sm:inline">&bull; <i class="fa-solid fa-user text-[11px]"></i> PACO (01 - General)</span>
        </div>
        <div class="flex items-center gap-2 text-xs text-slate-500 font-medium">
          <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block animate-pulse"></span>
          <span id="txtEstadoCloud">Cloud Conectado</span>
          <span class="text-slate-300">&bull;</span>
          <span id="headerCajaNum">Caja 1</span>
          <span class="text-slate-300">&bull;</span>
          <span class="text-orange-600 font-semibold">Tarifa Estándar</span>
        </div>
      </div>
    </div>

    <!-- Acciones Cabecera -->
    <div class="flex items-center gap-2">
      <!-- Botón Pendientes -->
      <button onclick="abrirModalPendientes()" class="px-3 py-1.5 rounded-full bg-amber-500 text-white font-bold text-xs flex items-center gap-1.5 shadow-sm hover:bg-amber-600 active:scale-95 transition-all">
        <i class="fa-solid fa-paperclip"></i>
        <span>Pendientes</span>
        <span id="badgeContadorPendientes" class="w-5 h-5 rounded-full bg-white text-amber-700 text-[10px] font-black flex items-center justify-center">0</span>
      </button>

      <button id="btnLupa" onclick="toggleBuscador()" class="w-9 h-9 rounded-full bg-slate-100 hover:bg-slate-200 active:scale-95 flex items-center justify-center text-slate-600 transition-all cursor-pointer" title="Buscar productos">
        <i class="fa-solid fa-magnifying-glass text-xs"></i>
      </button>

      <button onclick="abrirModalEditorCarta()" class="w-9 h-9 rounded-full bg-orange-600 text-white hover:bg-orange-700 active:scale-95 flex items-center justify-center transition-all shadow-sm cursor-pointer" title="Gestor de carta en la nube (Artículos, IVA y Categorías)">
        <i class="fa-solid fa-pen-to-square text-xs"></i>
      </button>

      <button id="btnAjustes" onclick="toggleAjustesModal()" class="w-9 h-9 rounded-full bg-amber-100/70 hover:bg-amber-100 active:scale-95 flex items-center justify-center text-amber-800 transition-all cursor-pointer" title="Datos fiscales del ticket y terminal">
        <i class="fa-solid fa-sliders text-xs"></i>
      </button>

      <button onclick="abrirModalCaja()" class="px-3 py-1.5 rounded-full bg-slate-800 text-white hover:bg-slate-900 active:scale-95 font-bold text-xs flex items-center gap-1.5 transition-all shadow-sm" title="Arqueo de turno y Cierre Z">
        <i class="fa-solid fa-cash-register"></i>
        <span class="hidden sm:inline">Caja</span>
      </button>
    </div>
  </header>

  <!-- BARRA DE BÚSQUEDA DESPLEGABLE -->
  <div id="barraBuscador" class="hidden bg-white border-b border-orange-100 px-4 py-2 transition-all">
    <div class="relative flex items-center max-w-xl mx-auto">
      <i class="fa-solid fa-search absolute left-3.5 text-slate-400 text-xs"></i>
      <input type="text" id="inputBuscar" oninput="filtrarProductos()" placeholder="Buscar café, pan, bollería..." class="w-full pl-9 pr-8 py-2 rounded-xl bg-slate-100 border border-slate-200 text-sm focus:outline-none focus:border-orange-400">
      <button onclick="toggleBuscador()" class="absolute right-2.5 text-slate-400 hover:text-slate-600 p-1">
        <i class="fa-solid fa-xmark text-xs"></i>
      </button>
    </div>
  </div>

  <!-- TOAST FEEDBACK ARTÍCULO AÑADIDO -->
  <div id="toastArticuloAñadido" class="fixed top-16 left-1/2 -translate-x-1/2 bg-slate-900/90 backdrop-blur text-white px-4 py-2 rounded-full text-xs font-bold shadow-xl z-50 hidden flex items-center gap-2 border border-slate-700 transition-all">
    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
    <span id="toastArticuloTexto">+1 Añadido al ticket</span>
  </div>

  <!-- CONTENEDOR PRINCIPAL: DISTRIBUCIÓN TÁCTIL COMERCIAL 2 COLUMNAS -->
  <main class="flex-1 p-3 grid grid-cols-1 lg:grid-cols-12 gap-3 max-w-[1700px] w-full mx-auto">

    <!-- COLUMNA IZQUIERDA (5 COLUMNAS): TICKET EN CURSO + TOTAL + TECLADO FÍSICO / ASIGNAR A MESA -->
    <section class="lg:col-span-5 bg-white rounded-2xl border border-orange-100/90 shadow-sm flex flex-col justify-between overflow-hidden">
      <!-- Encabezado de Mesa / Mostrador -->
      <div class="p-3.5 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
        <div>
          <div class="flex items-center gap-2">
            <span class="font-black text-sm text-slate-900 tracking-tight" id="lblServicioActivo">BARRA</span>
            <span class="text-xs text-slate-400 font-mono" id="lblNumTicket">#T-001</span>
          </div>
          <span class="text-[11px] text-slate-500 font-medium" id="lblCliente">Cliente General</span>
        </div>
        <button onclick="limpiarTicket()" class="text-xs font-bold text-rose-500 hover:text-rose-700 bg-rose-50 px-2.5 py-1 rounded-lg border border-rose-200/60 flex items-center gap-1 active:scale-95 transition-all">
          <i class="fa-solid fa-trash-can text-[11px]"></i> Limpiar
        </button>
      </div>

      <!-- Cabecera columnas del ticket -->
      <div class="grid grid-cols-12 px-3 py-1.5 bg-slate-100/70 border-b border-slate-200 text-[10px] font-extrabold uppercase tracking-wider text-slate-500">
        <span class="col-span-6">Artículo</span>
        <span class="col-span-2 text-center">Cant</span>
        <span class="col-span-2 text-right">Precio</span>
        <span class="col-span-2 text-right">Total</span>
      </div>

      <!-- Lista de Ítems en el Ticket -->
      <div id="ticketContainer" class="flex-1 p-3 overflow-y-auto min-h-[220px] max-h-[380px] divide-y divide-slate-100">
        <div class="h-full flex flex-col items-center justify-center text-slate-400 py-12 text-center">
          <i class="fa-solid fa-receipt text-3xl mb-2 text-orange-200"></i>
          <p class="text-xs font-bold text-slate-500">Ticket vacío</p>
          <p class="text-[11px] text-slate-400">Toca los productos de la derecha para sumar.</p>
        </div>
      </div>

      <!-- Bloque Inferior: TOTAL A PAGAR + TECLADO NUMÉRICO TÁCTIL Y ACCIONES -->
      <div class="p-3 border-t border-orange-100 bg-orange-50/20 space-y-3">
        <!-- Display Total a Pagar -->
        <div class="bg-amber-50/70 border border-amber-200/80 rounded-xl p-3 flex items-center justify-between">
          <div>
            <span class="text-[11px] font-black uppercase tracking-wider text-slate-600 block">Total a Pagar</span>
            <span class="text-[10px] text-slate-400 font-medium" id="txtDetalleIVA">IVA inc. (0.00 €)</span>
          </div>
          <div class="text-right">
            <span id="txtGranTotal" class="font-black text-2xl sm:text-3xl font-display text-orange-600">0.00 €</span>
          </div>
        </div>

        <!-- Teclado Numérico Comercial + Botones de Acción (Finalizar, Dejar Pendiente, Asignar a Mesa, Plano Mesas) -->
        <div class="grid grid-cols-4 gap-2">
          <!-- Teclas Numéricas -->
          <button onclick="tecladoNumero('7')" class="py-3 bg-white hover:bg-slate-50 border border-slate-200 rounded-xl font-extrabold text-sm text-slate-800 shadow-sm active:scale-95">7</button>
          <button onclick="tecladoNumero('8')" class="py-3 bg-white hover:bg-slate-50 border border-slate-200 rounded-xl font-extrabold text-sm text-slate-800 shadow-sm active:scale-95">8</button>
          <button onclick="tecladoNumero('9')" class="py-3 bg-white hover:bg-slate-50 border border-slate-200 rounded-xl font-extrabold text-sm text-slate-800 shadow-sm active:scale-95">9</button>
          <button onclick="abrirModalCobroConTicket()" class="py-3 bg-orange-600 hover:bg-orange-700 text-white rounded-xl font-extrabold text-xs flex flex-col items-center justify-center gap-0.5 shadow-md shadow-orange-600/30 active:scale-95 transition-all">
            <span class="flex items-center gap-1"><i class="fa-solid fa-cash-register text-[10px]"></i> Finalizar Venta</span>
            <span class="text-[9px] opacity-75 font-mono">F1</span>
          </button>

          <button onclick="tecladoNumero('4')" class="py-3 bg-white hover:bg-slate-50 border border-slate-200 rounded-xl font-extrabold text-sm text-slate-800 shadow-sm active:scale-95">4</button>
          <button onclick="tecladoNumero('5')" class="py-3 bg-white hover:bg-slate-50 border border-slate-200 rounded-xl font-extrabold text-sm text-slate-800 shadow-sm active:scale-95">5</button>
          <button onclick="tecladoNumero('6')" class="py-3 bg-white hover:bg-slate-50 border border-slate-200 rounded-xl font-extrabold text-sm text-slate-800 shadow-sm active:scale-95">6</button>
          <button onclick="dejarPendiente()" class="py-3 bg-amber-500 hover:bg-amber-600 text-white rounded-xl font-bold text-xs flex items-center justify-center gap-1 shadow-sm active:scale-95 transition-all">
            <i class="fa-solid fa-paperclip text-[10px]"></i> Dejar Pendiente
          </button>

          <button onclick="tecladoNumero('1')" class="py-3 bg-white hover:bg-slate-50 border border-slate-200 rounded-xl font-extrabold text-sm text-slate-800 shadow-sm active:scale-95">1</button>
          <button onclick="tecladoNumero('2')" class="py-3 bg-white hover:bg-slate-50 border border-slate-200 rounded-xl font-extrabold text-sm text-slate-800 shadow-sm active:scale-95">2</button>
          <button onclick="tecladoNumero('3')" class="py-3 bg-white hover:bg-slate-50 border border-slate-200 rounded-xl font-extrabold text-sm text-slate-800 shadow-sm active:scale-95">3</button>
          <!-- BOTÓN ASIGNAR A MESA -->
          <button onclick="iniciarAsignarAMesa()" class="py-3 bg-orange-100 hover:bg-orange-200 text-orange-900 border border-orange-300/80 rounded-xl font-bold text-xs flex items-center justify-center gap-1 active:scale-95 transition-all" title="Asignar el ticket en curso directamente a una mesa del salón">
            <i class="fa-solid fa-chair text-[11px] text-orange-700"></i> Asignar a Mesa
          </button>

          <button onclick="tecladoNumero('0')" class="py-3 bg-white hover:bg-slate-50 border border-slate-200 rounded-xl font-extrabold text-sm text-slate-800 shadow-sm active:scale-95">0</button>
          <button onclick="tecladoNumero(',')" class="py-3 bg-white hover:bg-slate-50 border border-slate-200 rounded-xl font-extrabold text-sm text-slate-800 shadow-sm active:scale-95">,</button>
          <button onclick="tecladoBorrar()" class="py-3 bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 rounded-xl font-extrabold text-sm shadow-sm active:scale-95">C</button>
          <button onclick="abrirModalPlanoMesas()" class="py-3 bg-white hover:bg-slate-50 border border-orange-200 text-orange-800 rounded-xl font-bold text-xs flex items-center justify-center gap-1 shadow-sm active:scale-95">
            <i class="fa-solid fa-chair text-[10px]"></i> Plano Mesas
          </button>
        </div>
      </div>
    </section>

    <!-- COLUMNA DERECHA (7 COLUMNAS): BOTÓN DE MESAS + CATEGORÍAS + CATÁLOGO DE PRODUCTOS -->
    <section class="lg:col-span-7 space-y-3 flex flex-col">
      <!-- Barra de Filtros: Botón Mesas + Categorías -->
      <div class="flex items-center gap-2 overflow-x-auto pb-1 no-scrollbar text-xs font-semibold" id="contenedorCategorias">
        <!-- Botón Único Mesas -->
        <button onclick="abrirModalPlanoMesas()" class="px-4 py-2.5 rounded-xl bg-orange-600 text-white font-extrabold shadow-sm flex items-center gap-1.5 shrink-0 hover:bg-orange-700 active:scale-95 transition-all">
          <i class="fa-solid fa-chair"></i>
          <span>Mesas</span>
        </button>

        <!-- Botón Favoritos / Todos -->
        <button onclick="filtrarPorCategoria('todos', this)" class="btn-cat px-4 py-2.5 rounded-xl bg-orange-600 text-white font-extrabold shadow-sm shrink-0">
          ★ FAVORITOS / TODOS
        </button>

        <!-- Categorías dinámicas -->
        <div id="listaTabsCategorias" class="flex items-center gap-2"></div>
      </div>

      <!-- Rejilla de Productos Táctiles -->
      <div id="gridProductos" class="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-2.5 flex-1 auto-rows-max overflow-y-auto pb-6">
        <!-- Se renderiza dinámicamente -->
      </div>
    </section>
  </main>

  <!-- ========================================================================= -->
  <!-- MODAL DE COBRO (F1) CON PREVISUALIZACIÓN COMPLETA DEL TICKET              -->
  <!-- ========================================================================= -->
  <div id="modalCobroTicket" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3 sm:p-5">
    <div class="bg-white rounded-3xl w-full max-w-3xl overflow-hidden shadow-2xl flex flex-col max-h-[92vh] border border-orange-100 animate-in fade-in zoom-in-95 duration-150">
      
      <!-- Cabecera Modal Cobro -->
      <div class="px-5 py-3.5 bg-orange-50/70 border-b border-orange-100 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="w-8 h-8 rounded-full bg-orange-600 text-white flex items-center justify-center font-bold text-sm">
            <i class="fa-solid fa-receipt"></i>
          </span>
          <div>
            <h3 class="font-black text-slate-900 text-sm">Confirmar Venta y Cobro</h3>
            <span class="text-[11px] text-slate-500 font-medium">Revisa el ticket antes de cobrar al cliente</span>
          </div>
        </div>
        <button onclick="cerrarModalCobro()" class="text-slate-400 hover:text-slate-600 w-8 h-8 rounded-full hover:bg-white flex items-center justify-center transition-all">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>

      <!-- Cuerpo: 2 Columnas (Ticket fiel a la izquierda / Pago a la derecha) -->
      <div class="grid grid-cols-1 md:grid-cols-12 flex-1 overflow-y-auto divide-y md:divide-y-0 md:divide-x divide-slate-100">
        
        <!-- COLUMNA IZQUIERDA: PREVISUALIZACIÓN REAL DEL TICKET (TÉRMICO) -->
        <div class="md:col-span-6 p-5 bg-amber-50/20 flex flex-col justify-between space-y-3">
          <div class="bg-white border border-slate-200/80 rounded-2xl p-4 shadow-sm font-mono text-xs text-slate-800 space-y-3">
            
            <!-- Encabezado Ticket -->
            <div class="text-center border-b border-dashed border-slate-300 pb-2.5">
              <span class="text-lg font-black block tracking-tight font-display" id="tkNegocio">LA PIRULETA</span>
              <span class="text-[10px] text-slate-500 block" id="tkRazonSocial">Cafetería & Panadería Artesanal</span>
              <span class="text-[10px] text-slate-500 block" id="tkCIF">CIF: B-12345678</span>
              <span class="text-[10px] text-slate-500 block" id="tkDireccion">C/ Mayor 12 - Madrid</span>
              <span class="text-[10px] text-slate-500 block" id="tkTelefono">Tel: 600 000 000</span>
              <div class="flex justify-between text-[10px] text-slate-400 pt-1.5 mt-1 border-t border-slate-100">
                <span id="tkFechaHora">16/10/2026 18:30</span>
                <span id="tkNumero">TICKET #T-001</span>
              </div>
            </div>

            <!-- Desglose de Artículos del Ticket -->
            <div id="tkListaArticulos" class="divide-y divide-slate-100 max-h-[180px] overflow-y-auto pr-1 text-[11px]">
              <!-- Se rellena dinámicamente -->
            </div>

            <!-- Totales e Impuestos Desglosados -->
            <div class="border-t border-dashed border-slate-300 pt-2 space-y-1 text-[11px]">
              <div class="flex justify-between text-slate-600">
                <span>Base Imponible</span>
                <span id="tkBaseImponible">0.00 €</span>
              </div>
              <div class="flex justify-between text-slate-600">
                <span id="tkLabelIVA">Impuestos (IVA)</span>
                <span id="tkCuotaIVA">0.00 €</span>
              </div>
              <div class="flex justify-between font-black text-sm text-slate-900 pt-1.5 border-t border-slate-200">
                <span>TOTAL FACTURA</span>
                <span id="tkTotalPagar" class="text-orange-600 text-base font-display">0.00 €</span>
              </div>
            </div>

            <!-- Pie de Agradecimiento -->
            <div class="text-center text-[10px] text-slate-400 border-t border-dashed border-slate-300 pt-2" id="tkPieAgradecimiento">
              ¡Muchas gracias por su visita! Vuelva pronto 🍭
            </div>
          </div>
        </div>

        <!-- COLUMNA DERECHA: MEDIOS DE PAGO Y CONFIRMACIÓN -->
        <div class="md:col-span-6 p-5 flex flex-col justify-between space-y-4">
          <div class="space-y-3">
            <span class="text-xs font-bold text-slate-500 uppercase tracking-wider block">1. Seleccionar Medio de Pago</span>
            <div class="grid grid-cols-3 gap-2">
              <button onclick="seleccionarMedioPago('efectivo', this)" class="btn-pago py-3 px-2 rounded-2xl border-2 border-orange-500 bg-orange-50/60 font-bold text-xs text-orange-700 flex flex-col items-center gap-1 shadow-sm active:scale-95">
                <i class="fa-solid fa-money-bill-wave text-emerald-600 text-lg"></i>
                <span>Efectivo</span>
              </button>
              <button onclick="seleccionarMedioPago('tarjeta', this)" class="btn-pago py-3 px-2 rounded-2xl border border-slate-200 bg-white font-semibold text-xs text-slate-700 flex flex-col items-center gap-1 shadow-sm active:scale-95">
                <i class="fa-regular fa-credit-card text-blue-600 text-lg"></i>
                <span>Datáfono</span>
              </button>
              <button onclick="seleccionarMedioPago('bizum', this)" class="btn-pago py-3 px-2 rounded-2xl border border-slate-200 bg-white font-semibold text-xs text-slate-700 flex flex-col items-center gap-1 shadow-sm active:scale-95">
                <i class="fa-solid fa-mobile-screen-button text-teal-600 text-lg"></i>
                <span>Bizum</span>
              </button>
            </div>

            <!-- Calculadora de Cambio Rápido para Efectivo -->
            <div id="bloqueCalculoCambio" class="bg-slate-50 p-3 rounded-2xl border border-slate-100 space-y-2">
              <span class="text-[11px] font-bold text-slate-600 block">Efectivo entregado por cliente:</span>
              <div class="grid grid-cols-4 gap-1.5 text-xs font-bold">
                <button onclick="fijarEntrega(5)" class="py-1.5 bg-white border border-slate-200 rounded-lg hover:bg-slate-100">5 €</button>
                <button onclick="fijarEntrega(10)" class="py-1.5 bg-white border border-slate-200 rounded-lg hover:bg-slate-100">10 €</button>
                <button onclick="fijarEntrega(20)" class="py-1.5 bg-white border border-slate-200 rounded-lg hover:bg-slate-100">20 €</button>
                <button onclick="fijarEntrega(50)" class="py-1.5 bg-white border border-slate-200 rounded-lg hover:bg-slate-100">50 €</button>
              </div>
              <div class="flex items-center justify-between pt-1 text-xs">
                <span class="text-slate-500 font-medium">Cambio a devolver:</span>
                <span id="txtCambioDevolver" class="font-black text-sm text-emerald-600">0.00 €</span>
              </div>
            </div>
          </div>

          <!-- BOTÓN PRINCIPAL: CONFIRMAR Y COBRAR -->
          <button onclick="ejecutarCobroYDesplegarOpciones()" class="w-full py-4 rounded-2xl bg-orange-600 hover:bg-orange-700 active:scale-98 text-white font-black text-base shadow-xl shadow-orange-600/30 flex items-center justify-center gap-2 transition-all cursor-pointer">
            <i class="fa-solid fa-check text-lg"></i>
            <span>Confirmar y Cobrar</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ========================================================================= -->
  <!-- MODAL SELECTOR POST-COBRO: ENVIAR A WHATSAPP, IMPRIMIR O FINALIZAR        -->
  <!-- ========================================================================= -->
  <div id="modalSelectorPostVenta" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">

  <!-- JAVASCRIPT: LÓGICA COMPLETA DE V5.5                                      -->
  <!-- ========================================================================= -->
  <script>
    // 1. FIREBASE CONFIG
    const firebaseConfig = {
      apiKey: "AIzaSyDZ5xWCNJu2y6xg5x3QT03zlv58LWL96zQ",
      authDomain: "la-piruleta-tpv.firebaseapp.com",
      projectId: "la-piruleta-tpv",
      storageBucket: "la-piruleta-tpv.firebasestorage.app",
      messagingSenderId: "84528722277",
      appId: "1:84528722277:web:1dab40c7cf81fc92a0b18c"
    };

    let db = null;
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
      document.getElementById('txtEstadoCloud').innerText = "Cloud Conectado";
    } catch(e) {
      console.warn("Modo local activo:", e);
      document.getElementById('txtEstadoCloud').innerText = "Modo Local";
    }

    // Datos base
    const categoriasBase = [
      { id: 'cafe', nombre: 'Café', icono: '☕' },
      { id: 'pan', nombre: 'Pan', icono: '🥖' },
      { id: 'bolleria', nombre: 'Bollería', icono: '🥐' },
      { id: 'tostadas', nombre: 'Tostadas', icono: '🥪' }
    ];

    const catalogoBase = [
      { id: 1, nombre: 'Flat White Doble', categoria: 'cafe', precio: 2.80, iva: 10, icono: '☕' },
      { id: 2, nombre: 'Cappuccino Avena', categoria: 'cafe', precio: 2.90, iva: 10, icono: '🥛' },
      { id: 3, nombre: 'Cold Brew Nitro', categoria: 'cafe', precio: 3.40, iva: 10, icono: '🧊' },
      { id: 4, nombre: 'Hogaza Masa Madre 1kg', categoria: 'pan', precio: 4.20, iva: 4, icono: '🥖' },
      { id: 5, nombre: 'Barra Rústica Tradicional', categoria: 'pan', precio: 1.30, iva: 4, icono: '🥖' },
      { id: 6, nombre: 'Croissant Mantequilla', categoria: 'bolleria', precio: 1.80, iva: 10, icono: '🥐' },
      { id: 7, nombre: 'Napolitana Chocolate', categoria: 'bolleria', precio: 2.10, iva: 10, icono: '🍫' },
      { id: 8, nombre: 'Tostada Tomate y Aceite', categoria: 'tostadas', precio: 2.50, iva: 10, icono: '🥪' }
    ];

    let categorias = JSON.parse(localStorage.getItem('piruleta_categorias')) || categoriasBase;
    let catalogo = JSON.parse(localStorage.getItem('piruleta_catalogo')) || catalogoBase;
    let ticketActual = [];
    let ticketsPendientes = JSON.parse(localStorage.getItem('piruleta_pendientes')) || [];
    let correlativoTicket = Number(localStorage.getItem('piruleta_num_ticket')) || 1;
    let medioPagoActivo = 'efectivo';
    let categoriaFiltroActiva = 'todos';
    let mesaActivaSeleccionada = null;
    let modoMoverMesas = false;

    // Mesas en formato plano
    let mesas = JSON.parse(localStorage.getItem('piruleta_mesas_v5')) || [
      { id: 1, nombre: 'Mesa 1', x: 40, y: 40, ocupada: false, pax: 2, ticket: [] },
      { id: 2, nombre: 'Mesa 2', x: 180, y: 40, ocupada: false, pax: 2, ticket: [] },
      { id: 3, nombre: 'Mesa 3', x: 320, y: 40, ocupada: false, pax: 4, ticket: [] },
      { id: 4, nombre: 'Mesa 4', x: 40, y: 170, ocupada: false, pax: 4, ticket: [] },
      { id: 5, nombre: 'Mesa 5', x: 180, y: 170, ocupada: false, pax: 2, ticket: [] },
      { id: 6, nombre: 'Mesa 6', x: 320, y: 170, ocupada: false, pax: 4, ticket: [] }
    ];

    let caja = JSON.parse(localStorage.getItem('piruleta_caja')) || { efectivo: 0, tarjeta: 0, bizum: 0, total: 0 };
    let datosFiscales = JSON.parse(localStorage.getItem('piruleta_fiscales')) || {
      nombre: "LA PIRULETA",
      cif: "B-12345678",
      razonSocial: "Cafetería La Piruleta S.L.",
      direccion: "Calle Mayor 12, 28001 Madrid",
      telefono: "600 000 000",
      pieTicket: "¡Muchas gracias por su visita! Vuelva pronto 🍭",
      caja: "Caja 1"
    };

    let ultimoTicketCobrado = null; // Guardado temporal para el modal post-venta

    function guardarTodo() {
      localStorage.setItem('piruleta_categorias', JSON.stringify(categorias));
      localStorage.setItem('piruleta_catalogo', JSON.stringify(catalogo));
      localStorage.setItem('piruleta_pendientes', JSON.stringify(ticketsPendientes));
      localStorage.setItem('piruleta_mesas_v5', JSON.stringify(mesas));
      localStorage.setItem('piruleta_caja', JSON.stringify(caja));
      localStorage.setItem('piruleta_fiscales', JSON.stringify(datosFiscales));
      localStorage.setItem('piruleta_num_ticket', correlativoTicket);
    }

    // SINCRONIZACIÓN FIREBASE FIRESTORE EN TIEMPO REAL
    if (db) {
      db.collection("productos").onSnapshot((snapshot) => {
        if (!snapshot.empty) {
          const list = [];
          snapshot.forEach(doc => {
            const d = doc.data();
            list.push({
              id: doc.id,
              docId: doc.id,
              nombre: d.nombre,
              precio: Number(d.precio) || 0,
              iva: Number(d.iva) || 10,
              categoria: d.categoria || 'cafe',
              icono: d.icono || '☕'
            });
          });
          catalogo = list;
          guardarTodo();
          renderCatalogo();
          renderListaEditorProductos();
        } else {
          catalogoBase.forEach(item => db.collection("productos").add(item));
        }
      });

      db.collection("categorias").onSnapshot((snapshot) => {
        if (!snapshot.empty) {
          const catList = [];
          snapshot.forEach(doc => {
            const d = doc.data();
            catList.push({ id: doc.id, docId: doc.id, nombre: d.nombre, icono: d.icono || '🏷️' });
          });
          categorias = catList;
          guardarTodo();
          renderTabsCategorias();
          renderListaEditorCategorias();
          actualizarSelectorCategoriasModal();
        }
      });
    }

    // --- RENDER CATEGORÍAS & PRODUCTOS ---
    function renderTabsCategorias() {
      const cont = document.getElementById('listaTabsCategorias');
      if (!cont) return;
      cont.innerHTML = '';
      categorias.forEach(cat => {
        const btn = document.createElement('button');
        btn.onclick = () => filtrarPorCategoria(cat.id, btn);
        btn.className = `btn-cat px-4 py-2.5 rounded-xl ${categoriaFiltroActiva === cat.id ? 'bg-orange-600 text-white font-extrabold shadow-sm' : 'bg-white text-slate-700 border border-orange-100 font-semibold'} shrink-0 active:scale-95 transition-all`;
        btn.innerHTML = `${cat.icono || '🏷️'} ${cat.nombre}`;
        cont.appendChild(btn);
      });
    }

    function filtrarPorCategoria(catId, btn) {
      categoriaFiltroActiva = catId;
      document.querySelectorAll('.btn-cat').forEach(b => {
        b.className = 'btn-cat px-4 py-2.5 rounded-xl bg-white text-slate-700 border border-orange-100 font-semibold shrink-0';
      });
      if (btn) btn.className = 'btn-cat px-4 py-2.5 rounded-xl bg-orange-600 text-white font-extrabold shadow-sm shrink-0';
      if (catId === 'todos') {
        renderCatalogo(catalogo);
      } else {
        renderCatalogo(catalogo.filter(p => p.categoria === catId));
      }
    }

    function renderCatalogo(lista = catalogo) {
      const grid = document.getElementById('gridProductos');
      if (!grid) return;
      grid.innerHTML = '';
      lista.forEach(prod => {
        const prodId = prod.id || prod.docId;
        const card = document.createElement('div');
        card.className = 'bg-white rounded-2xl p-3.5 border border-orange-100/90 shadow-sm flex flex-col justify-between hover:border-orange-300 active:scale-95 transition-all cursor-pointer';
        card.innerHTML = `
          <div class="flex items-start justify-between">
            <span class="text-2xl">${prod.icono || '☕'}</span>
            <span class="text-[9px] uppercase font-bold text-slate-400 bg-slate-100 px-1.5 py-0.5 rounded">${prod.categoria}</span>
          </div>
          <div class="mt-2.5">
            <h4 class="font-bold text-xs text-slate-800 leading-tight line-clamp-2">${prod.nombre}</h4>
            <div class="flex items-center justify-between mt-2 pt-2 border-t border-slate-50">
              <span class="font-black text-sm text-slate-900 font-display">${Number(prod.precio || 0).toFixed(2)} €</span>
              <span class="text-[10px] text-emerald-700 bg-emerald-50 px-1 rounded font-bold">${prod.iva || 10}%</span>
            </div>
          </div>
        `;
        card.onclick = () => agregarAlTicket(prodId);
        grid.appendChild(card);
      });
    }

    // --- TICKET & TOTALES ---
    function agregarAlTicket(id) {
      const prod = catalogo.find(p => String(p.id) === String(id) || String(p.docId) === String(id));
      if (!prod) return;
      const existe = ticketActual.find(i => String(i.id) === String(id) || String(i.docId) === String(id));
      if (existe) {
        existe.cantidad += 1;
      } else {
        ticketActual.push({
          id: prod.id || prod.docId,
          nombre: prod.nombre,
          precio: Number(prod.precio) || 0,
          iva: Number(prod.iva) || 10,
          icono: prod.icono || '☕',
          cantidad: 1
        });
      }
      actualizarTicketVisual();
      mostrarToastFeedback(`+1 ${prod.nombre}`);
    }

    function cambiarCantidadTicket(id, delta) {
      const item = ticketActual.find(i => String(i.id) === String(id));
      if (!item) return;
      item.cantidad += delta;
      if (item.cantidad <= 0) {
        ticketActual = ticketActual.filter(i => String(i.id) !== String(id));
      }
      actualizarTicketVisual();
    }

    function limpiarTicket() {
      ticketActual = [];
      mesaActivaSeleccionada = null;
      document.getElementById('lblServicioActivo').innerText = 'BARRA';
      actualizarTicketVisual();
    }

    function actualizarTicketVisual() {
      const cont = document.getElementById('ticketContainer');
      const totalSpan = document.getElementById('txtGranTotal');
      const detalleIVA = document.getElementById('txtDetalleIVA');

      if (ticketActual.length === 0) {
        cont.innerHTML = `
          <div class="h-full flex flex-col items-center justify-center text-slate-400 py-12 text-center">
            <i class="fa-solid fa-receipt text-3xl mb-2 text-orange-200"></i>
            <p class="text-xs font-bold text-slate-500">Ticket vacío</p>
            <p class="text-[11px] text-slate-400">Toca los productos de la derecha para sumar.</p>
          </div>
        `;
        totalSpan.innerText = '0.00 €';
        detalleIVA.innerText = 'IVA inc. (0.00 €)';
        return;
      }

      cont.innerHTML = '';
      let total = 0;
      let totalCuotaIVA = 0;

      ticketActual.forEach(item => {
        const itemTotal = item.precio * item.cantidad;
        total += itemTotal;
        const cuota = itemTotal - (itemTotal / (1 + (item.iva / 100)));
        totalCuotaIVA += cuota;

        const row = document.createElement('div');
        row.className = 'grid grid-cols-12 py-2 items-center text-xs';
        row.innerHTML = `
          <div class="col-span-6 pr-1">
            <span class="font-bold text-slate-800 block truncate">${item.nombre}</span>
            <span class="text-[10px] text-slate-400 font-mono">${item.precio.toFixed(2)} € &bull; IVA ${item.iva}%</span>
          </div>
          <div class="col-span-2 flex items-center justify-center">
            <div class="flex items-center border border-slate-200 rounded-lg bg-slate-50">
              <button onclick="cambiarCantidadTicket('${item.id}', -1)" class="w-5 h-5 flex items-center justify-center text-slate-500 hover:text-slate-900 font-bold">-</button>
              <span class="w-5 text-center font-bold text-[11px]">${item.cantidad}</span>
              <button onclick="cambiarCantidadTicket('${item.id}', 1)" class="w-5 h-5 flex items-center justify-center text-slate-500 hover:text-slate-900 font-bold">+</button>
            </div>
          </div>
          <span class="col-span-2 text-right font-mono text-slate-500 text-[11px]">${item.precio.toFixed(2)}</span>
          <span class="col-span-2 text-right font-bold font-mono text-slate-900">${itemTotal.toFixed(2)}</span>
        `;
        cont.appendChild(row);
      });

      totalSpan.innerText = total.toFixed(2) + ' €';
      detalleIVA.innerText = `IVA inc. (${totalCuotaIVA.toFixed(2)} €)`;
    }

    function mostrarToastFeedback(txt) {
      const toast = document.getElementById('toastArticuloAñadido');
      document.getElementById('toastArticuloTexto').innerText = txt;
      toast.classList.remove('hidden');
      clearTimeout(window._tToast);
      window._tToast = setTimeout(() => toast.classList.add('hidden'), 1200);
    }

    let bufferTeclado = "";
    function tecladoNumero(val) {
      bufferTeclado += val;
      console.log("Teclado:", bufferTeclado);

    // --- DEJAR PENDIENTE (APARCAR TICKET) ---
    function dejarPendiente() {
      if (ticketActual.length === 0) {
        alert("El ticket está vacío. Añade productos antes de dejarlo pendiente.");
        return;
      }
      const pendiente = {
        id: Date.now(),
        fecha: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        servicio: document.getElementById('lblServicioActivo').innerText,
        ticket: JSON.parse(JSON.stringify(ticketActual)),
        total: ticketActual.reduce((acc, i) => acc + (i.precio * i.cantidad), 0)
      };
      ticketsPendientes.push(pendiente);
      guardarTodo();
      actualizarBadgePendientes();
      limpiarTicket();
      alert("Ticket dejado pendiente con éxito.");
    }

    function actualizarBadgePendientes() {
      document.getElementById('badgeContadorPendientes').innerText = ticketsPendientes.length;
    }

    function abrirModalPendientes() {
      const modal = document.getElementById('modalPendientes');
      const cont = document.getElementById('listaTicketsPendientes');
      cont.innerHTML = '';
      if (ticketsPendientes.length === 0) {
        cont.innerHTML = '<p class="text-center text-slate-400 py-6">No hay tickets pendientes.</p>';
      } else {
        ticketsPendientes.forEach((p, idx) => {
          const div = document.createElement('div');
          div.className = 'py-2.5 flex items-center justify-between';
          div.innerHTML = `
            <div>
              <span class="font-bold text-slate-800">${p.servicio} (${p.total.toFixed(2)} €)</span>
              <span class="block text-[10px] text-slate-400">${p.fecha} &bull; ${p.ticket.length} productos</span>
            </div>
            <button onclick="recuperarTicketPendiente(${idx})" class="px-2.5 py-1 bg-amber-500 hover:bg-amber-600 text-white rounded-lg font-bold text-xs">
              Recuperar
            </button>
          `;
          cont.appendChild(div);
        });
      }
      modal.classList.remove('hidden');
    }

    function cerrarModalPendientes() {
      document.getElementById('modalPendientes').classList.add('hidden');
    }

    function recuperarTicketPendiente(idx) {
      const p = ticketsPendientes[idx];
      ticketActual = JSON.parse(JSON.stringify(p.ticket));
      document.getElementById('lblServicioActivo').innerText = p.servicio;
      ticketsPendientes.splice(idx, 1);
      guardarTodo();
      actualizarBadgePendientes();
      actualizarTicketVisual();
      cerrarModalPendientes();
    }

    // --- ASIGNAR A MESA DIRECTO ---
    function iniciarAsignarAMesa() {
      if (ticketActual.length === 0) {
        alert("Añade artículos al ticket antes de asignarlo a una mesa.");
        return;
      }
      const total = ticketActual.reduce((acc, i) => acc + (i.precio * i.cantidad), 0);
      document.getElementById('txtAsignarTotalInfo').innerText = `Total a transferir: ${total.toFixed(2)} €`;
      
      const grid = document.getElementById('gridMesasParaAsignar');
      grid.innerHTML = '';
      mesas.forEach(m => {
        const btn = document.createElement('button');
        btn.onclick = () => completarAsignacionMesa(m.id);
        btn.className = `p-3 rounded-2xl border text-center active:scale-95 transition-all ${m.ocupada ? 'bg-orange-50 border-orange-300 text-orange-900' : 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100'}`;
        btn.innerHTML = `
          <span class="text-xl block mb-1">🪑</span>
          <span class="font-extrabold text-xs block">${m.nombre}</span>
          <span class="text-[10px] block font-semibold ${m.ocupada ? 'text-orange-600' : 'text-emerald-600'}">${m.ocupada ? 'Ocupada' : 'Libre'}</span>
        `;
        grid.appendChild(btn);
      });

      document.getElementById('modalAsignarAMesa').classList.remove('hidden');
    }

    function cerrarModalAsignarAMesa() {
      document.getElementById('modalAsignarAMesa').classList.add('hidden');
    }

    function completarAsignacionMesa(mesaId) {
      const mesa = mesas.find(m => m.id === mesaId);
      if (!mesa) return;
      mesa.ocupada = true;
      // Sumar comanda
      mesa.ticket = (mesa.ticket || []).concat(JSON.parse(JSON.stringify(ticketActual)));
      guardarTodo();
      limpiarTicket();
      cerrarModalAsignarAMesa();
      alert(`Ticket asignado con éxito a ${mesa.nombre}.`);
    }

    // --- MODAL DE COBRO (F1) CON PREVISUALIZACIÓN COMPLETA DEL TICKET ---
    function abrirModalCobroConTicket() {
      if (ticketActual.length === 0) {
        alert("El ticket está vacío. Toca productos para poder cobrar.");
        return;
      }

      // 1. Rellenar datos del ticket fiscal
      document.getElementById('tkNegocio').innerText = datosFiscales.nombre || "LA PIRULETA";
      document.getElementById('tkRazonSocial').innerText = datosFiscales.razonSocial || "Cafetería La Piruleta S.L.";
      document.getElementById('tkCIF').innerText = "CIF/NIF: " + (datosFiscales.cif || "B-12345678");
      document.getElementById('tkDireccion').innerText = datosFiscales.direccion || "C/ Mayor 12, Madrid";
      document.getElementById('tkTelefono').innerText = "Tel: " + (datosFiscales.telefono || "600 000 000");
      document.getElementById('tkPieAgradecimiento').innerText = datosFiscales.pieTicket || "¡Muchas gracias por su visita! Vuelva pronto 🍭";

      const ahora = new Date();
      document.getElementById('tkFechaHora').innerText = ahora.toLocaleDateString() + ' ' + ahora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      // 2. Renderizar líneas del ticket
      const listaCont = document.getElementById('tkListaArticulos');
      listaCont.innerHTML = '';
      let subtotalBase = 0;
      let totalCuotaIVA = 0;
      let totalGeneral = 0;

      ticketActual.forEach(item => {
        const itemTotal = item.precio * item.cantidad;
        totalGeneral += itemTotal;
        const cuota = itemTotal - (itemTotal / (1 + (item.iva / 100)));
        totalCuotaIVA += cuota;
        subtotalBase += (itemTotal - cuota);

        const row = document.createElement('div');
        row.className = 'py-1 flex justify-between items-center';
        row.innerHTML = `
          <span class="font-bold truncate max-w-[170px]">${item.cantidad}x ${item.nombre}</span>
          <span class="font-mono text-slate-600">${itemTotal.toFixed(2)} €</span>
        `;
        listaCont.appendChild(row);
      });

      document.getElementById('tkCuotaIVA').innerText = totalCuotaIVA.toFixed(2) + ' €';
      document.getElementById('tkTotalPagar').innerText = totalGeneral.toFixed(2) + ' €';

      fijarEntrega(totalGeneral); // Por defecto entrega importe exacto
      document.getElementById('modalCobroTicket').classList.remove('hidden');
    }

    function cerrarModalCobro() {
      document.getElementById('modalCobroTicket').classList.add('hidden');
    }

    function seleccionarMedioPago(medio, btn) {
      medioPagoActivo = medio;
      document.querySelectorAll('.btn-pago').forEach(b => {
        b.className = 'btn-pago py-3 px-2 rounded-2xl border border-slate-200 bg-white font-semibold text-xs text-slate-700 flex flex-col items-center gap-1 shadow-sm active:scale-95';
      });
      btn.className = 'btn-pago py-3 px-2 rounded-2xl border-2 border-orange-500 bg-orange-50/60 font-bold text-xs text-orange-700 flex flex-col items-center gap-1 shadow-sm active:scale-95';
    }

    function fijarEntrega(cant) {
      const total = ticketActual.reduce((acc, i) => acc + (i.precio * i.cantidad), 0);
      const cambio = Math.max(0, cant - total);
      document.getElementById('txtCambioDevolver').innerText = cambio.toFixed(2) + ' €';
    }

    // --- CONFIRMAR Y COBRAR -> DESPLEGAR SELECTOR POST-VENTA (WHATSAPP, IMPRIMIR, FINALIZAR) ---
    function ejecutarCobroYDesplegarOpciones() {
      const total = ticketActual.reduce((acc, i) => acc + (i.precio * i.cantidad), 0);
      
      // Asentar en contabilidad de caja
      if (medioPagoActivo === 'efectivo') caja.efectivo += total;
      else if (medioPagoActivo === 'tarjeta') caja.tarjeta += total;
      else if (medioPagoActivo === 'bizum') caja.bizum += total;
      caja.total += total;

      // Guardar copia del ticket para imprimir o WhatsApp
      ultimoTicketCobrado = {
        num: '#T-' + String(correlativoTicket).padStart(3, '0'),
        fechaHora: new Date().toLocaleString(),
        servicio: document.getElementById('lblServicioActivo').innerText,
        articulos: JSON.parse(JSON.stringify(ticketActual)),
        total: total,
        metodo: medioPagoActivo
      };

      // Si correspondía a una mesa, liberarla automáticamente
      if (mesaActivaSeleccionada) {
        const idx = mesas.findIndex(m => m.id === mesaActivaSeleccionada.id);
        if (idx !== -1) {
          mesas[idx].ocupada = false;
          mesas[idx].ticket = [];
        }
      }

      correlativoTicket += 1;
      guardarTodo();

      // Cerrar modal de cobro y abrir el selector post-venta
      cerrarModalCobro();
      document.getElementById('modalSelectorPostVenta').classList.remove('hidden');
    }

    // --- ACCIÓN 1: ENVIAR A WHATSAPP ---
    function postVentaWhatsApp() {
      if (!ultimoTicketCobrado) return;
      let msg = `*🍭 LA PIRULETA - Ticket ${ultimoTicketCobrado.num}*\n`;
      msg += `Fecha: ${ultimoTicketCobrado.fechaHora}\n`;
      msg += `Servicio: ${ultimoTicketCobrado.servicio}\n\n`;
      msg += `*DETALLE:*\n`;
      ultimoTicketCobrado.articulos.forEach(art => {
        msg += `- ${art.cantidad}x ${art.nombre}: ${(art.precio * art.cantidad).toFixed(2)} €\n`;
      });
      msg += `\n*TOTAL: ${ultimoTicketCobrado.total.toFixed(2)} €* (IVA incl.)\n`;
      msg += `Pago: ${ultimoTicketCobrado.metodo.toUpperCase()}\n\n`;
      msg += `${datosFiscales.pieTicket || '¡Muchas gracias por su visita!'}`;

      const tel = prompt("Introduce el teléfono del cliente para WhatsApp (con prefijo ej. 34600000000) o déjalo vacío para abrir selector:");
      let url = "https://wa.me/";
      if (tel && tel.trim().length > 0) {
        url += tel.replace(/\D/g, '') + "?text=" + encodeURIComponent(msg);
      } else {
        url = "https://api.whatsapp.com/send?text=" + encodeURIComponent(msg);
      }
      window.open(url, '_blank');
      postVentaFinalizar();
    }

    // --- PLANO DE MESAS ARRASTRABLE (DRAG & DROP) ---
    function abrirModalPlanoMesas() {

      document.getElementById('modalPlanoMesas').classList.remove('hidden');
    }

    function toggleModoMover() {
      modoMoverMesas = !modoMoverMesas;
      const btn = document.getElementById('btnModoMover');
      const txt = document.getElementById('txtModoMover');
      if (modoMoverMesas) {
        btn.className = 'px-3 py-1.5 rounded-xl bg-orange-600 text-white font-bold text-xs flex items-center gap-1 shadow-sm';

    function crearNuevaMesa() {
      const num = mesas.length + 1;
      mesas.push({
        id: Date.now(),
        nombre: 'Mesa ' + num,
        x: 60 + ((num * 30) % 250),
        y: 60 + ((num * 25) % 180),
        ocupada: false,
        pax: 4,
        ticket: []
      });
      guardarTodo();
      renderPlanoMesas();
    }

    function renderPlanoMesas() {
      const lienzo = document.getElementById('lienzoPlanoMesas');
      if (!lienzo) return;
      lienzo.innerHTML = '';

      mesas.forEach(mesa => {
        const div = document.createElement('div');
        div.className = `absolute w-24 h-24 rounded-2xl flex flex-col items-center justify-center p-2 border-2 cursor-pointer transition-shadow shadow-md ${mesa.ocupada ? 'bg-orange-100 border-orange-500 text-orange-950 font-black' : 'bg-white border-orange-200 text-slate-800 font-bold'} ${modoMoverMesas ? 'ring-2 ring-orange-400 animate-pulse cursor-move' : ''}`;
        div.style.left = mesa.x + 'px';
        div.style.top = mesa.y + 'px';

        const totalMesa = (mesa.ticket || []).reduce((acc, i) => acc + (i.precio * i.cantidad), 0);

        div.innerHTML = `
          <span class="text-xl">🪑</span>
          <span class="text-xs font-extrabold truncate w-full text-center mt-0.5">${mesa.nombre}</span>
          <span class="text-[10px] ${mesa.ocupada ? 'text-orange-700' : 'text-slate-400'}">${mesa.ocupada ? totalMesa.toFixed(2) + ' €' : mesa.pax + ' pax'}</span>
        `;

        // Soporte de Arrastre (Drag)
        if (modoMoverMesas) {
          hacerElementoArrastrable(div, mesa);
        } else {
          div.onclick = () => abrirMenuMesaIndividual(mesa.id);
        }

        lienzo.appendChild(div);
      });
    }

    function hacerElementoArrastrable(elmnt, mesaData) {
      let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
      elmnt.onmousedown = dragMouseDown;
      elmnt.ontouchstart = dragTouchStart;

      function dragMouseDown(e) {
        e.preventDefault();
        pos3 = e.clientX;
        pos4 = e.clientY;
        document.onmouseup = closeDragElement;
        document.onmousemove = elementDrag;
      }

      function elementDrag(e) {
        e.preventDefault();
        pos1 = pos3 - e.clientX;
        pos2 = pos4 - e.clientY;
        pos3 = e.clientX;
        pos4 = e.clientY;
        const newLeft = Math.max(10, Math.min(elmnt.parentElement.clientWidth - 110, elmnt.offsetLeft - pos1));
        const newTop = Math.max(10, Math.min(elmnt.parentElement.clientHeight - 110, elmnt.offsetTop - pos2));
        elmnt.style.left = newLeft + "px";
        elmnt.style.top = newTop + "px";
        mesaData.x = newLeft;
        mesaData.y = newTop;
      }

      function closeDragElement() {
        document.onmouseup = null;
        document.onmousemove = null;
        guardarTodo();
      }

      function dragTouchStart(e) {
        const touch = e.touches[0];
        pos3 = touch.clientX;
        pos4 = touch.clientY;
        document.ontouchend = closeTouchDrag;
        document.ontouchmove = touchDrag;
      }

      function touchDrag(e) {
        const touch = e.touches[0];
        pos1 = pos3 - touch.clientX;
        pos2 = pos4 - touch.clientY;
        pos3 = touch.clientX;
        pos4 = touch.clientY;
        const newLeft = Math.max(10, Math.min(elmnt.parentElement.clientWidth - 110, elmnt.offsetLeft - pos1));
        const newTop = Math.max(10, Math.min(elmnt.parentElement.clientHeight - 110, elmnt.offsetTop - pos2));
        elmnt.style.left = newLeft + "px";
        elmnt.style.top = newTop + "px";
        mesaData.x = newLeft;
        mesaData.y = newTop;
      }

      function closeTouchDrag() {
        document.ontouchend = null;
        document.ontouchmove = null;
        guardarTodo();
      }
    }

    function abrirMenuMesaIndividual(mesaId) {
      const mesa = mesas.find(m => m.id === mesaId);
      if (!mesa) return;
      mesaActivaSeleccionada = mesa;
      document.getElementById('lblServicioActivo').innerText = mesa.nombre.toUpperCase();
      ticketActual = JSON.parse(JSON.stringify(mesa.ticket || []));
      actualizarTicketVisual();
      cerrarModalPlanoMesas();
    }

    // --- GESTOR DE CARTA EN LA NUBE (ARTÍCULOS + IVA + CATEGORÍAS) ---
    function abrirModalEditorCarta() {
      actualizarSelectorCategoriasModal();
      renderListaEditorProductos();
      renderListaEditorCategorias();
      document.getElementById('modalEditorCarta').classList.remove('hidden');
    }

    function cerrarModalEditorCarta() {
      cancelarEdicionProducto();
      document.getElementById('modalEditorCarta').classList.add('hidden');
    }

    function cambiarTabEditor(tab, btn) {
      document.querySelectorAll('.btn-tab-editor').forEach(b => {
        b.className = 'btn-tab-editor py-1.5 rounded-lg text-slate-600';
      });
      btn.className = 'btn-tab-editor py-1.5 rounded-lg bg-white shadow-sm text-orange-600';
      if (tab === 'articulos') {
        document.getElementById('editorTabArticulos').classList.remove('hidden');
        document.getElementById('editorTabCategorias').classList.add('hidden');
      } else {
        document.getElementById('editorTabArticulos').classList.add('hidden');
        document.getElementById('editorTabCategorias').classList.remove('hidden');
      }
    }

    function actualizarSelectorCategoriasModal() {
      const sel = document.getElementById('nuevoProdCat');
      if (!sel) return;
      sel.innerHTML = '';
      categorias.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat.id;
        opt.innerText = `${cat.icono || ''} ${cat.nombre}`;
        sel.appendChild(opt);
      });
    }

    function guardarProductoEnNube() {
      const idEdit = document.getElementById('editandoProdId').value;
      const nombre = document.getElementById('nuevoProdNombre').value.trim();
      const precio = parseFloat(document.getElementById('nuevoProdPrecio').value);
      const cat = document.getElementById('nuevoProdCat').value;
      const icono = document.getElementById('nuevoProdIcono').value.trim() || '☕';
      const iva = parseInt(document.getElementById('nuevoProdIVA').value) || 10;

      if (!nombre || isNaN(precio)) {
        alert("Por favor introduce nombre y precio.");
        return;
      }

      if (idEdit) {
        // Modificar existente
        if (db) {
          db.collection("productos").doc(idEdit).update({ nombre, precio, categoria: cat, icono, iva });
        }
        const idx = catalogo.findIndex(p => String(p.id) === idEdit || String(p.docId) === idEdit);
        if (idx !== -1) {
          catalogo[idx] = { ...catalogo[idx], nombre, precio, categoria: cat, icono, iva };
        }
      } else {
        // Crear nuevo
        const nuevo = { nombre, precio, categoria: cat, icono, iva };
        if (db) {
          db.collection("productos").add(nuevo);
        } else {
          catalogo.push({ id: Date.now(), ...nuevo });
        }
      }

      guardarTodo();
      renderCatalogo();
      renderListaEditorProductos();
      cancelarEdicionProducto();
      alert("Producto guardado con éxito.");
    }

    function editarProductoModal(id) {
      const prod = catalogo.find(p => String(p.id) === String(id) || String(p.docId) === String(id));
      if (!prod) return;
      document.getElementById('editandoProdId').value = prod.id || prod.docId;
      document.getElementById('nuevoProdNombre').value = prod.nombre;
      document.getElementById('nuevoProdPrecio').value = prod.precio;
      document.getElementById('nuevoProdCat').value = prod.categoria;
      document.getElementById('nuevoProdIcono').value = prod.icono || '☕';
      document.getElementById('nuevoProdIVA').value = prod.iva || 10;

      document.getElementById('tituloFormArticulo').innerText = "Modificar Artículo: " + prod.nombre;
      document.getElementById('btnGuardarProd').innerText = "Actualizar en la Nube";
      document.getElementById('btnCancelarEdicionProd').classList.remove('hidden');
    }

    function cancelarEdicionProducto() {
      document.getElementById('editandoProdId').value = "";
      document.getElementById('nuevoProdNombre').value = "";
      document.getElementById('nuevoProdPrecio').value = "";
      document.getElementById('nuevoProdIcono').value = "";
      document.getElementById('tituloFormArticulo').innerText = "Añadir Nuevo Producto";
      document.getElementById('btnGuardarProd').innerText = "Guardar en la Nube";
      document.getElementById('btnCancelarEdicionProd').classList.add('hidden');
    }

    function eliminarProductoEnNube(id) {
      if (!confirm("¿Eliminar este producto de la carta?")) return;
      if (db) db.collection("productos").doc(id).delete();
      catalogo = catalogo.filter(p => String(p.id) !== String(id) && String(p.docId) !== String(id));
      guardarTodo();
      renderCatalogo();
      renderListaEditorProductos();
    }

    function renderListaEditorProductos() {
      const cont = document.getElementById('listaEditorProductos');
      if (!cont) return;
      cont.innerHTML = '';
      catalogo.forEach(p => {
        const id = p.id || p.docId;
        const div = document.createElement('div');
        div.className = 'py-2 flex items-center justify-between';
        div.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="text-base">${p.icono || '☕'}</span>
            <div>
              <span class="font-bold text-slate-800 block truncate max-w-[140px]">${p.nombre}</span>
              <span class="text-[10px] text-slate-400 font-mono">${Number(p.precio).toFixed(2)} € &bull; ${p.categoria} &bull; IVA ${p.iva || 10}%</span>
            </div>
          </div>
          <div class="flex items-center gap-1.5">
            <button onclick="editarProductoModal('${id}')" class="w-7 h-7 rounded-lg bg-orange-100 text-orange-700 hover:bg-orange-200 flex items-center justify-center font-bold" title="Editar">
              <i class="fa-solid fa-pen text-xs"></i>
            </button>
            <button onclick="eliminarProductoEnNube('${id}')" class="w-7 h-7 rounded-lg bg-rose-50 text-rose-600 hover:bg-rose-100 flex items-center justify-center font-bold" title="Eliminar">
              <i class="fa-solid fa-trash-can text-xs"></i>
            </button>
          </div>
        `;
        cont.appendChild(div);
      });
    }

    // Categorías en la Nube
    function guardarCategoriaEnNube() {
      const nombre = document.getElementById('nuevaCatNombre').value.trim();
      const icono = document.getElementById('nuevaCatIcono').value.trim() || '🏷️';
      if (!nombre) return;
      const id = nombre.toLowerCase().replace(/\s+/g, '_');
      if (db) {
        db.collection("categorias").add({ nombre, icono });
      } else {
        categorias.push({ id, nombre, icono });
      }
      guardarTodo();
      renderTabsCategorias();
      renderListaEditorCategorias();
      actualizarSelectorCategoriasModal();
      document.getElementById('nuevaCatNombre').value = '';
      document.getElementById('nuevaCatIcono').value = '';
    }

    function renderListaEditorCategorias() {
      const cont = document.getElementById('listaEditorCategorias');
      if (!cont) return;
      cont.innerHTML = '';
      categorias.forEach(cat => {
        const div = document.createElement('div');
        div.className = 'py-2 flex items-center justify-between';
        div.innerHTML = `
          <span class="font-bold text-slate-800">${cat.icono || '🏷️'} ${cat.nombre}</span>
          <button onclick="eliminarCategoriaEnNube('${cat.id}')" class="w-7 h-7 rounded-lg bg-rose-50 text-rose-600 hover:bg-rose-100 flex items-center justify-center font-bold">
            <i class="fa-solid fa-trash-can text-xs"></i>
          </button>
        `;
        cont.appendChild(div);
      });
    }

    function eliminarCategoriaEnNube(id) {
      if (!confirm("¿Eliminar categoría?")) return;
      if (db) db.collection("categorias").doc(id).delete();
      categorias = categorias.filter(c => c.id !== id);
      guardarTodo();
      renderTabsCategorias();
      renderListaEditorCategorias();
    }

    // --- AJUSTES FISCALES ---
    function toggleAjustesModal() {
      const m = document.getElementById('modalAjustes');
      m.classList.toggle('hidden');
      if (!m.classList.contains('hidden')) {
        document.getElementById('cfgNombre').value = datosFiscales.nombre || "LA PIRULETA";
        document.getElementById('cfgCIF').value = datosFiscales.cif || "";
        document.getElementById('cfgRazonSocial').value = datosFiscales.razonSocial || "";
        document.getElementById('cfgDireccion').value = datosFiscales.direccion || "";
        document.getElementById('cfgTelefono').value = datosFiscales.telefono || "";
        document.getElementById('cfgPieTicket').value = datosFiscales.pieTicket || "";
      }
    }

    function guardarAjustes() {
      datosFiscales.nombre = document.getElementById('cfgNombre').value.trim() || "LA PIRULETA";
      datosFiscales.cif = document.getElementById('cfgCIF').value.trim();
      datosFiscales.razonSocial = document.getElementById('cfgRazonSocial').value.trim();
      datosFiscales.direccion = document.getElementById('cfgDireccion').value.trim();
      datosFiscales.telefono = document.getElementById('cfgTelefono').value.trim();
      datosFiscales.pieTicket = document.getElementById('cfgPieTicket').value.trim();
      guardarTodo();
      document.getElementById('headerNombreComercial').innerText = datosFiscales.nombre;
      toggleAjustesModal();
      alert("Datos fiscales guardados con éxito.");
    }

    // --- CAJA & ARQUEO Z ---
    function abrirModalCaja() {
      document.getElementById('cjEfectivo').innerText = caja.efectivo.toFixed(2) + ' €';
      document.getElementById('cjTarjeta').innerText = caja.tarjeta.toFixed(2) + ' €';
      document.getElementById('cjBizum').innerText = caja.bizum.toFixed(2) + ' €';
      document.getElementById('cjTotal').innerText = caja.total.toFixed(2) + ' €';
      document.getElementById('modalCaja').classList.remove('hidden');
    }

    function cerrarModalCaja() {
      document.getElementById('modalCaja').classList.add('hidden');
    }

    function confirmarCierreZ() {
      if (!confirm("¿Deseas cerrar el turno y descargar el Resumen Z diario? La caja se reiniciará a 0.00 €.")) return;
      const resumen = `==================================
CIERRE DE CAJA Z - ${datosFiscales.nombre}
Fecha: ${new Date().toLocaleString()}
Caja: 1 &bull; Responsable: PACO
==================================
Efectivo en Cajón: ${caja.efectivo.toFixed(2)} €
Datáfono / Tarjeta: ${caja.tarjeta.toFixed(2)} €
Bizum Recibidos:   ${caja.bizum.toFixed(2)} €
----------------------------------
TOTAL FACTURADO:   ${caja.total.toFixed(2)} €
==================================`;

      const blob = new Blob([resumen], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'Resumen_Z_' + new Date().toISOString().slice(0, 10) + '.txt';
      a.click();

      caja = { efectivo: 0, tarjeta: 0, bizum: 0, total: 0 };
      guardarTodo();
      abrirModalCaja();
      alert("Caja cerrada y reiniciada a 0.00 € con éxito.");
    }

    function volverAlMostrador() {
      limpiarTicket();
    }

    // INICIALIZACIÓN GENERAL AL CARGAR
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('headerNombreComercial').innerText = datosFiscales.nombre;
      renderTabsCategorias();
      renderCatalogo();
      actualizarTicketVisual();
      actualizarBadgePendientes();
      document.getElementById('lblNumTicket').innerText = '#T-' + String(correlativoTicket).padStart(3, '0');
    });
  <\/script>
